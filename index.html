<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORBITAL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#050810; touch-action:none;
    -webkit-user-select:none; user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  #c { display:block; width:100%; height:100%; }
  #hud {
    position:absolute; top:0; left:0; right:0; padding:24px;
    display:flex; justify-content:center; pointer-events:none; z-index:10;
  }
  #score {
    color:#fff; font-size:46px; font-weight:800; letter-spacing:3px;
    text-shadow:0 0 20px rgba(94,207,122,0.9), 0 0 44px rgba(94,207,122,0.5);
  }
  .screen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:14px; z-index:20;
    background:radial-gradient(circle at center,rgba(10,15,30,0.65) 0%,rgba(5,8,16,0.96) 100%);
    cursor:pointer; text-align:center; padding:20px;
  }
  .screen.hidden { display:none; }
  .title {
    color:#fff; font-size:56px; font-weight:900; letter-spacing:10px;
    text-shadow:0 0 30px rgba(94,207,122,1), 0 0 60px rgba(94,207,122,0.5);
    margin-bottom:12px;
  }
  .sub { color:#5ecf7a; font-size:13px; letter-spacing:4px; text-transform:uppercase; }
  .hint { color:#8899aa; font-size:13px; margin-top:24px; letter-spacing:2px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
  .gameover-title {
    color:#ff4466; font-size:32px; font-weight:800; letter-spacing:6px;
    text-shadow:0 0 24px rgba(255,68,102,0.9);
  }
  .big { color:#fff; font-size:80px; font-weight:900; margin:8px 0;
    text-shadow:0 0 32px rgba(94,207,122,0.9); }
  .best { color:#ffcc00; font-size:15px; letter-spacing:3px; margin-top:4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div></div>

<div id="menu" class="screen">
  <div class="title">ORBITAL</div>
  <div class="sub">Chain Orbits · Slingshot Forward</div>
  <div class="hint">TAP TO START</div>
</div>

<div id="gameover" class="screen hidden">
  <div class="gameover-title">GAME OVER</div>
  <div class="big" id="final-score">0</div>
  <div class="best" id="best-score">BEST: 0</div>
  <div class="hint">TAP TO RETRY</div>
</div>

<script>
(() => {
'use strict';

// ============ CANVAS ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const menuEl = document.getElementById('menu');
const gameoverEl = document.getElementById('gameover');
const finalScoreEl = document.getElementById('final-score');
const bestScoreEl = document.getElementById('best-score');

let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.stars.length === 0) G.stars = makeStars();
}
window.addEventListener('resize', resize);

// ============ TUNING ============
const ORBIT_RADIUS = 55;
const ORBIT_SPEED = 2.8;
const FLY_SPEED = 340;
const CAPTURE_PAD = 25;
const MIN_PLANET_DIST = 260;
const MAX_PLANET_DIST = 400;
const MAX_PLANET_Y_OFF = 150;
const MAX_FLY_TIME = 3.5;
const TRAIL_LIFETIME = 0.55;
const PREVIEW_LENGTH = 520;

// ============ STATE ============
const G = {
  mode: 'menu',
  score: 0,
  best: parseInt(localStorage.getItem('orbital-best') || '0'),
  time: 0,
  player: null,
  planets: [],
  particles: [],
  stars: [],
  camera: { x: 0, y: 0 },
  flash: 0,
  shake: 0,
  flyingTime: 0,
};

// ============ HELPERS ============
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

// ============ COLORS ============
const PALETTE = [
  { main: '#00e5ff', dark: '#0077aa', glow: 'rgba(0,229,255,0.75)' },
  { main: '#ff2bb8', dark: '#aa0066', glow: 'rgba(255,43,184,0.75)' },
  { main: '#aaff00', dark: '#669900', glow: 'rgba(170,255,0,0.75)' },
  { main: '#ff8800', dark: '#aa4400', glow: 'rgba(255,136,0,0.75)' },
  { main: '#aa55ff', dark: '#6600cc', glow: 'rgba(170,85,255,0.75)' },
  { main: '#ff3344', dark: '#aa0011', glow: 'rgba(255,51,68,0.75)' },
];

// ============ FACTORIES ============
function makePlanet(x, y, radius) {
  const c = PALETTE[(Math.random() * PALETTE.length) | 0];
  return {
    x, y, radius, color: c,
    rotation: Math.random() * Math.PI * 2,
    rotationSpeed: rand(-0.5, 0.5),
  };
}

function makePlayer(planet) {
  return {
    x: planet.x,
    y: planet.y - ORBIT_RADIUS,
    vx: 0, vy: 0,
    mode: 'orbit',
    planet,
    angle: -Math.PI / 2,
    orbitRadius: ORBIT_RADIUS,
    trail: [],
    radius: 9,
  };
}

function makeStars() {
  const stars = [];
  for (let i = 0; i < 130; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.6 + 0.3,
      alpha: Math.random() * 0.7 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
  return stars;
}

function makeParticle(x, y, o = {}) {
  const angle = o.angle !== undefined ? o.angle : Math.random() * Math.PI * 2;
  const speed = o.speed !== undefined ? o.speed : rand(40, 180);
  const life = o.life !== undefined ? o.life : rand(0.4, 0.9);
  return {
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life, maxLife: life,
    size: o.size || rand(1.5, 3.5),
    color: o.color || '#fff',
    drag: o.drag !== undefined ? o.drag : 0.93,
    ring: o.ring || false,
  };
}

// ============ SPAWNING ============
function spawnNextPlanet() {
  const last = G.planets[G.planets.length - 1];
  let p;
  if (!last) {
    p = makePlanet(0, 0, rand(30, 42));
  } else {
    const d = rand(MIN_PLANET_DIST, MAX_PLANET_DIST);
    const dy = rand(-MAX_PLANET_Y_OFF, MAX_PLANET_Y_OFF);
    p = makePlanet(last.x + d, last.y + dy, rand(28, 42));
  }
  G.planets.push(p);
  return p;
}

// ============ RESET ============
function resetGame() {
  G.mode = 'playing';
  G.score = 0;
  G.time = 0;
  G.planets = [];
  G.particles = [];
  G.flash = 0;
  G.shake = 0;
  G.flyingTime = 0;
  G.stars = makeStars();

  const p = spawnNextPlanet();
  G.player = makePlayer(p);
  G.camera.x = p.x;
  G.camera.y = p.y;

  for (let i = 0; i < 5; i++) spawnNextPlanet();

  scoreEl.textContent = '0';
  menuEl.classList.add('hidden');
  gameoverEl.classList.add('hidden');
}

// ============ INPUT ============
function onTap(e) {
  if (e) e.preventDefault();
  if (G.mode === 'menu' || G.mode === 'gameover') {
    resetGame();
    return;
  }
  if (G.mode !== 'playing') return;
  const p = G.player;
  if (!p || p.mode !== 'orbit') return;

  // Release: tangential velocity
  const t = p.angle;
  p.vx = -Math.sin(t) * FLY_SPEED;
  p.vy = Math.cos(t) * FLY_SPEED;
  p.mode = 'fly';
  G.flyingTime = 0;

  // Release burst
  const dirA = Math.atan2(p.vy, p.vx) + Math.PI;
  for (let i = 0; i < 14; i++) {
    G.particles.push(makeParticle(p.x, p.y, {
      angle: dirA + rand(-0.6, 0.6),
      speed: rand(60, 220),
      life: rand(0.3, 0.6),
      color: '#ffffff',
      size: rand(1.5, 3),
    }));
  }
}

canvas.addEventListener('pointerdown', onTap, { passive: false });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    onTap();
  }
});

// ============ GAME OVER ============
function gameOver() {
  G.mode = 'gameover';
  G.shake = 14;
  if (G.score > G.best) {
    G.best = G.score;
    localStorage.setItem('orbital-best', G.best);
  }
  finalScoreEl.textContent = G.score;
  bestScoreEl.textContent = 'BEST: ' + G.best;
  gameoverEl.classList.remove('hidden');

  const p = G.player;
  if (p) {
    for (let i = 0; i < 44; i++) {
      G.particles.push(makeParticle(p.x, p.y, {
        angle: Math.random() * Math.PI * 2,
        speed: rand(100, 420),
        life: rand(0.6, 1.3),
        color: i % 3 === 0 ? '#ff3366' : (i % 3 === 1 ? '#ffffff' : '#ffaa00'),
        size: rand(2, 4.5),
      }));
    }
  }
}

// ============ CAPTURE ============
function capturePlayer(planet, dx, dy) {
  const p = G.player;
  p.planet = planet;
  p.mode = 'orbit';
  p.angle = Math.atan2(dy, dx);
  p.orbitRadius = Math.max(Math.sqrt(dx * dx + dy * dy), planet.radius + 22);
  p.vx = 0;
  p.vy = 0;
  p.trail = [];

  G.score += 10;
  scoreEl.textContent = G.score;
  G.flash = 0.55;
  G.shake = 6;

  // Burst
  const c = planet.color.main;
  for (let i = 0; i < 22; i++) {
    G.particles.push(makeParticle(p.x, p.y, {
      angle: (i / 22) * Math.PI * 2,
      speed: rand(80, 260),
      life: rand(0.4, 0.85),
      color: c,
      size: rand(1.5, 3.5),
    }));
  }
  // Expanding ring
  G.particles.push(makeParticle(p.x, p.y, {
    angle: 0, speed: 0, life: 0.45,
    color: c, size: 12, ring: true, drag: 1,
  }));

  while (G.planets.length < 6) spawnNextPlanet();

  // Prune old planets (keep list tight)
  while (G.planets.length > 8 && G.planets[0] !== planet) {
    G.planets.shift();
  }
}

// ============ UPDATE ============
function update(dt) {
  G.time += dt;
  G.flash = Math.max(0, G.flash - dt * 4);
  G.shake = Math.max(0, G.shake - dt * 30);

  if (G.mode === 'playing') {
    updatePlayer(dt);
    updateParticles(dt);
    updateCamera(dt);
  } else {
    updateParticles(dt);
  }

  // Twinkle stars
  for (const s of G.stars) s.twinkle += dt * 2;
}

function updatePlayer(dt) {
  const p = G.player;
  if (!p) return;

  if (p.mode === 'orbit') {
    p.angle += ORBIT_SPEED * dt;
    p.orbitRadius = lerp(p.orbitRadius, ORBIT_RADIUS, Math.min(1, dt * 6));
    p.x = p.planet.x + p.orbitRadius * Math.cos(p.angle);
    p.y = p.planet.y + p.orbitRadius * Math.sin(p.angle);
    p.planet.rotation += p.planet.rotationSpeed * dt;

  } else if (p.mode === 'fly') {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    G.flyingTime += dt;

    // Check capture
    for (const planet of G.planets) {
      const dx = p.x - planet.x;
      const dy = p.y - planet.y;
      const d2 = dx * dx + dy * dy;
      const capR = planet.radius + ORBIT_RADIUS + CAPTURE_PAD;
      if (d2 < capR * capR) {
        capturePlayer(planet, dx, dy);
        return;
      }
    }

    if (G.flyingTime > MAX_FLY_TIME) {
      gameOver();
      return;
    }

    // Trail
    p.trail.push({ x: p.x, y: p.y, t: 0 });
    for (const tr of p.trail) tr.t += dt;
    p.trail = p.trail.filter(tr => tr.t < TRAIL_LIFETIME);

    // Trail sparks
    if (Math.random() < 0.65) {
      G.particles.push(makeParticle(p.x, p.y, {
        angle: Math.atan2(-p.vy, -p.vx) + rand(-0.5, 0.5),
        speed: rand(20, 80),
        life: rand(0.3, 0.7),
        color: '#ffee88',
        size: rand(1, 2.5),
      }));
    }
  }
}

function updateParticles(dt) {
  for (const pt of G.particles) {
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vx *= Math.pow(pt.drag, dt * 60);
    pt.vy *= Math.pow(pt.drag, dt * 60);
    pt.life -= dt;
    if (pt.ring) pt.size += dt * 220;
  }
  G.particles = G.particles.filter(p => p.life > 0);
}

function updateCamera(dt) {
  const p = G.player;
  if (!p) return;
  const smooth = 1 - Math.pow(0.008, dt);
  G.camera.x = lerp(G.camera.x, p.x, smooth);
  G.camera.y = lerp(G.camera.y, p.y, smooth);
}

// ============ RENDER ============
function w2s(wx, wy) {
  return { x: wx - G.camera.x + W / 2, y: wy - G.camera.y + H / 2 };
}

function render() {
  ctx.save();

  // Screen shake
  if (G.shake > 0.1) {
    ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  }

  // Background
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.85);
  bg.addColorStop(0, '#0d1424');
  bg.addColorStop(1, '#050810');
  ctx.fillStyle = bg;
  ctx.fillRect(-30, -30, W + 60, H + 60);

  // Stars
  for (const s of G.stars) {
    const tw = 0.7 + Math.sin(s.twinkle) * 0.3;
    ctx.globalAlpha = s.alpha * tw;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Planets
  for (const planet of G.planets) drawPlanet(planet);

  // Particles
  for (const pt of G.particles) {
    const sp = w2s(pt.x, pt.y);
    const a = Math.max(0, pt.life / pt.maxLife);
    ctx.globalAlpha = a;
    if (pt.ring) {
      ctx.strokeStyle = pt.color;
      ctx.lineWidth = 3 * a;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, pt.size, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, pt.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Player
  if (G.player) drawPlayer(G.player);

  // Flash
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.4})`;
    ctx.fillRect(-60, -60, W + 120, H + 120);
  }

  ctx.restore();
}

function drawPlanet(planet) {
  const sp = w2s(planet.x, planet.y);
  const r = planet.radius;
  if (sp.x < -r * 3 - 100 || sp.x > W + r * 3 + 100 ||
      sp.y < -r * 3 - 100 || sp.y > H + r * 3 + 100) return;

  // Outer glow
  const grd = ctx.createRadialGradient(sp.x, sp.y, r * 0.6, sp.x, sp.y, r * 3.2);
  grd.addColorStop(0, planet.color.glow);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r * 3.2, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const body = ctx.createRadialGradient(
    sp.x - r * 0.3, sp.y - r * 0.35, r * 0.1,
    sp.x, sp.y, r
  );
  body.addColorStop(0, planet.color.main);
  body.addColorStop(1, planet.color.dark);
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
  ctx.fill();

  // Rotating decoration
  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(planet.rotation);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.6, 0, Math.PI * 1.35);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.35, Math.PI, Math.PI * 2.15);
  ctx.stroke();
  ctx.restore();

  // Orbit ring if current planet
  if (G.player && G.player.mode === 'orbit' && G.player.planet === planet) {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 7]);
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, ORBIT_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawPlayer(p) {
  const sp = w2s(p.x, p.y);

  // Trail
  for (const tr of p.trail) {
    const a = 1 - tr.t / TRAIL_LIFETIME;
    const s = w2s(tr.x, tr.y);
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = '#ffee88';
    ctx.beginPath();
    ctx.arc(s.x, s.y, p.radius * a * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Glow
  const glow = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, p.radius * 4.5);
  glow.addColorStop(0, 'rgba(255,255,200,0.8)');
  glow.addColorStop(1, 'rgba(255,255,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, p.radius * 4.5, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, p.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffee88';
  ctx.beginPath();
  ctx.arc(sp.x, sp.y, p.radius * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // Trajectory preview
  if (p.mode === 'orbit') {
    const t = p.angle;
    const dirX = -Math.sin(t);
    const dirY = Math.cos(t);
    const s = w2s(p.x, p.y);
    const e = w2s(p.x + dirX * PREVIEW_LENGTH, p.y + dirY * PREVIEW_LENGTH);

    // Dashed line
    ctx.strokeStyle = 'rgba(255,255,255,0.42)';
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 9]);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(e.x, e.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrow
    const ang = Math.atan2(e.y - s.y, e.x - s.x);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x - Math.cos(ang - 0.4) * 16, e.y - Math.sin(ang - 0.4) * 16);
    ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x - Math.cos(ang + 0.4) * 16, e.y - Math.sin(ang + 0.4) * 16);
    ctx.stroke();
  }
}

// ============ LOOP ============
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ============ START ============
resize();
G.stars = makeStars();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
