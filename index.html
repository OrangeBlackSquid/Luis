<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiterleitung...</title>

    <meta http-equiv="refresh" content="0; url=https://pornhub.com">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a2980, #26d0ce);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .message a {
            color: #26d0ce;
            text-decoration: none;
            font-weight: 700;
            border-bottom: 2px solid #26d0ce;
            transition: color 0.3s, border-color 0.3s;
        }

        .message a:hover {
            color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p class="message">
        Du wirst weitergeleitet...<br>
        <a href="https://placeholder.com">Falls nicht, klicke hier</a>
    </p>

    <script>
        window.location.replace("https://pornhub.com");
    </script>
</body>
</html>
