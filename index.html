<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis - APB System</title>
    <style>
        /* Design passend zum Bild */
        body {
            background-color: #121212; /* Dunkler Hintergrund */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 2em;
        }

        h2 {
            color: #f0b132; /* Gelb/Gold */
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2c2f33;
            color: white;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #f0b132;
        }

        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background-color: #f0b132;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #dca01f;
        }

        .notes-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Design der APB Karten */
        .note-card {
            background-color: #2c2f33;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: left;
            position: relative;
        }

        .note-card .apb-title {
            color: #f0b132;
            font-weight: 800;
            font-size: 1.1em;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .note-card .note-text {
            color: #e0e0e0;
            font-size: 1em;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .note-card .note-meta {
            color: #72767d;
            font-size: 0.85em;
        }

        /* Admin Steuerung Design */
        .admin-controls {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }
        .btn-delete:hover { background-color: #c0392b; }

        .btn-edit {
            background-color: #3498db;
            color: white;
        }
        .btn-edit:hover { background-color: #2980b9; }

        /* Der UNSICHTBARE Login-Button oben rechts */
        #adminTrigger {
            position: fixed;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 9999;
            background: transparent;
            border: none;
            cursor: pointer;
            color: transparent; /* Text unsichtbar machen */
        }
        /* Entfernt den Hover-Effekt für den unsichtbaren Button */
        #adminTrigger:hover {
            background: transparent;
        }

        /* NEU: Modal (Fenster) für Generelle Informationen */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 10000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.8); /* Dunkler Hintergrund */
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: #2c2f33;
            margin: 15% auto; 
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            width: 80%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover { color: white; }

        #infoText {
            width: 100%;
            height: 150px;
            background-color: #1e2124;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
            margin-top: 15px;
            font-size: 15px;
        }

        #infoText:focus { outline: none; border-color: #f0b132; }
        #infoText:read-only { opacity: 0.7; cursor: not-allowed; border-color: #333; }
        
        #saveInfoBtn {
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- UNSICHTBARER Login-Button oben rechts -->
    <button id="adminTrigger" onclick="handleAdminAuth()">Login</button>

    <h1>Luis</h1>
    <h2>APB System</h2>

    <!-- Button für Generelle Informationen (Jetzt im Standard-Orange) -->
    <button onclick="openInfoModal()" style="margin-bottom: 25px; width: 100%; max-width: 500px;">Generelle Informationen</button>

    <div class="input-container">
        <input type="text" id="noteInput" placeholder="Notiz eingeben (z.B. Test)...">
        <button onclick="addNote()">Senden</button>
    </div>

    <div class="notes-container" id="notesContainer">
        <!-- Hier werden die Notizen automatisch eingefügt -->
    </div>

    <!-- Das Modal (Fenster) für die Informationen -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeInfoModal()">&times;</span>
            <h3 style="margin-top: 0; color: #f0b132;">Informationen</h3>
            <textarea id="infoText" readonly placeholder="Noch keine Informationen vorhanden..."></textarea>
            <button id="saveInfoBtn" onclick="saveInfo()" style="display: none;">Speichern</button>
        </div>
    </div>

    <!-- Firebase SDK laden -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // DEINE FIREBASE KONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB5v8vEyaoscAxcP2spKx6WoHGwc29gElA",
            authDomain: "luis-apb.firebaseapp.com",
            databaseURL: "https://luis-apb-default-rtdb.firebaseio.com",
            projectId: "luis-apb",
            storageBucket: "luis-apb.firebasestorage.app",
            messagingSenderId: "58041196627",
            appId: "1:58041196627:web:1c92e32d445853f5f9a6a6"
        };
        // ==========================================

        // Firebase initialisieren
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const notesRef = ref(db, 'apb_notes');
        const infoRef = ref(db, 'apb_info'); 

        const notesContainer = document.getElementById('notesContainer');
        
        // Admin Status und Passwort
        const ADMIN_CODE = "DLQ33"; 
        let isAdmin = localStorage.getItem('isAPBAdmin') === 'true';

        // ==========================================
        // ADMIN LOGIN / LOGOUT LOGIK
        // ==========================================
        window.handleAdminAuth = function() {
            if (isAdmin) {
                const code = prompt("Du bist Admin. Gib den Code ein, um dich auszuloggen:");
                if (code === ADMIN_CODE) {
                    isAdmin = false;
                    localStorage.removeItem('isAPBAdmin');
                    alert("Admin-Modus deaktiviert.");
                    location.reload(); 
                } else if (code !== null) {
                    alert("Falscher Code! Du bleibst Admin.");
                }
            } else {
                const code = prompt("Admin-Code eingeben:");
                if (code === ADMIN_CODE) {
                    isAdmin = true;
                    localStorage.setItem('isAPBAdmin', 'true');
                    alert("Admin-Modus aktiviert!");
                    location.reload(); 
                } else if (code !== null) {
                    alert("Falscher Code!");
                }
            }
        }

        // ==========================================
        // LOGIK FÜR GENERELLE INFORMATIONEN
        // ==========================================
        
        window.openInfoModal = function() {
            document.getElementById('infoModal').style.display = 'block';
        }

        window.closeInfoModal = function() {
            document.getElementById('infoModal').style.display = 'none';
        }

        onValue(infoRef, (snapshot) => {
            const infoTextArea = document.getElementById('infoText');
            const saveBtn = document.getElementById('saveInfoBtn');
            const data = snapshot.val();

            infoTextArea.value = data || "";

            if (isAdmin) {
                infoTextArea.removeAttribute('readonly');
                infoTextArea.placeholder = "Hier kannst du Informationen für alle eintragen...";
                saveBtn.style.display = 'block';
            } else {
                infoTextArea.setAttribute('readonly', 'true');
                infoTextArea.placeholder = "Noch keine Informationen vorhanden...";
                saveBtn.style.display = 'none';
            }
        });

        window.saveInfo = function() {
            if (!isAdmin) return;
            const text = document.getElementById('infoText').value;
            set(infoRef, text)
                .then(() => {
                    alert("Informationen erfolgreich gespeichert!");
                    closeInfoModal();
                })
                .catch((error) => {
                    alert("Fehler beim Speichern: " + error.message);
                });
        }

        // ==========================================
        // NOTIZEN ANZEIGEN
        // ==========================================
        onValue(notesRef, (snapshot) => {
            notesContainer.innerHTML = ''; 
            const data = snapshot.val();
            
            if (data) {
                const notesArray = Object.entries(data).sort((a, b) => b[1].timestamp - a[1].timestamp);

                notesArray.forEach(([id, note]) => {
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    
                    const noteTitle = note.isAdminNote ? 'Admin note' : 'Note';
                    
                    let adminButtons = '';
                    if (isAdmin) {
                        adminButtons = `
                            <div class="admin-controls">
                                <button class="btn-small btn-edit" onclick="editNote('${id}')">Bearbeiten</button>
                                <button class="btn-small btn-delete" onclick="deleteNote('${id}')">Entfernen</button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="apb-title">APB</div>
                        <div class="note-text">${noteTitle}: ${note.text}</div>
                        <div class="note-meta">By: ${note.author} ${note.dateString}</div>
                        ${adminButtons}
                    `;
                    notesContainer.appendChild(card);
                });
            }
        });

        // ==========================================
        // NEUE NOTIZ HINZUFÜGEN
        // ==========================================
        window.addNote = function() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();

            if (text === "") return; 

            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const dateString = `${day}/${month}/${year} ${hours}:${minutes}`;

            const authorName = isAdmin ? 'Admin' : 'Anonym';
            const isAdminNote = isAdmin ? true : false;

            push(notesRef, {
                text: text,
                author: authorName,
                isAdminNote: isAdminNote,
                dateString: dateString,
                timestamp: Date.now()
            });

            input.value = '';
        }

        // ==========================================
        // ADMIN FUNKTIONEN (LÖSCHEN & BEARBEITEN)
        // ==========================================
        window.deleteNote = function(id) {
            if (!isAdmin) return;
            if (confirm("Willst du diese Notiz wirklich löschen?")) {
                remove(ref(db, 'apb_notes/' + id));
            }
        }

        window.editNote = function(id) {
            if (!isAdmin) return;
            const newText = prompt("Bitte gib den neuen Text für diese Notiz ein:");
            if (newText !== null && newText.trim() !== "") {
                update(ref(db, 'apb_notes/' + id), {
                    text: newText.trim()
                });
            }
        }
        
        // Modal schließen, wenn man außerhalb davon klickt
        window.onclick = function(event) {
            const modal = document.getElementById('infoModal');
            if (event.target == modal) {
                closeInfoModal();
            }
        }
    </script>
</body>
</html>
