<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash – Stereo Madness, Back on Track, Polargeist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f1a;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #1a1a3e 0%, #0f0f1a 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #ui > * {
            pointer-events: auto;
        }

        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 20;
        }

        .menu-screen.hidden {
            display: none;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(94, 207, 122, 0.8);
            margin-bottom: 10px;
            text-align: center;
        }

        h2 {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .level-select {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80%;
            max-width: 400px;
        }

        .level-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-btn:hover, .level-btn:active {
            background: rgba(94, 207, 122, 0.2);
            border-color: #5ecf7a;
            transform: scale(1.02);
        }

        .level-btn .diff {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.7;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        #progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 6;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5ecf7a, #a3e635);
            transition: width 0.1s linear;
            border-radius: 0 3px 3px 0;
        }

        #attempts {
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #percentage {
            color: #5ecf7a;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #back-btn {
            position: absolute;
            top: 50px;
            left: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            z-index: 15;
        }

        #back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #death-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(200, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
            pointer-events: none;
        }

        #death-screen.hidden {
            display: none;
        }

        #death-screen .text {
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        #death-screen .sub {
            color: #ddd;
            font-size: 16px;
            margin-top: 10px;
        }

        .controls-hint {
            color: #6b7280;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" style="display:none;">
        <div id="attempts">Versuch: 1</div>
        <div id="percentage">0%</div>
    </div>
    <div id="progress-bar-container" style="display:none;">
        <div id="progress-bar"></div>
    </div>
    <button id="back-btn" style="display:none;">← Menü</button>

    <!-- Death Screen -->
    <div id="death-screen" class="hidden">
        <div class="text">💀 Game Over</div>
        <div class="sub">Tippe zum Neustart</div>
    </div>

    <!-- Hauptmenü -->
    <div id="menu" class="menu-screen">
        <h1>GEOMETRY DASH</h1>
        <h2>Wähle ein Level</h2>
        <div class="level-select">
            <button class="level-btn" data-level="0">
                <span>1. Stereo Madness</span>
                <span class="diff">⭐ Easy – 1 Stern</span>
            </button>
            <button class="level-btn" data-level="1">
                <span>2. Back on Track</span>
                <span class="diff">⭐⭐ Easy – 2 Sterne</span>
            </button>
            <button class="level-btn" data-level="2">
                <span>3. Polargeist</span>
                <span class="diff">⭐⭐⭐ Normal – 3 Sterne</span>
            </button>
        </div>
        <p class="controls-hint">Leertaste / Klick / Tap = Springen</p>
    </div>
</div>

<script>
/* ============================================================
   GEOMETRY DASH – WEB CLONE
   Level 1-3: Stereo Madness, Back on Track, Polargeist
   ============================================================ */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- DOM Elemente ---
const menuEl = document.getElementById('menu');
const hudEl = document.getElementById('hud');
const attemptsEl = document.getElementById('attempts');
const percentageEl = document.getElementById('percentage');
const progressBar = document.getElementById('progress-bar');
const progressContainer = document.getElementById('progress-bar-container');
const backBtn = document.getElementById('back-btn');
const deathScreen = document.getElementById('death-screen');

// --- Spielfeld ---
const GROUND_Y = 380;          // Y-Position des Bodens (Oberkante)
const CEILING_Y = 0;           // Decke
const BLOCK_SIZE = 40;         // Größe eines Blocks
const PLAYER_SIZE = 34;        // Größe des Spielers

// --- Spielzustand ---
let gameState = 'menu';        // 'menu', 'playing', 'dead', 'complete'
let currentLevel = 0;
let attempts = 1;
let cameraX = 0;               // Kamera-Offset (Weltkoordinaten)
let player, entities, levelLength, levelConfig;
let gameSpeed = 4.5;           // Pixel pro Frame
let frameCounter = 0;
let deathTimer = 0;
let progress = 0;
let particles = [];
let trailParticles = [];
let bgPulse = 0;

// --- Canvas Größe ---
function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 0);

// ============================================================
//  LEVEL-DATEN
//  Jedes Level wird als Array von "Chunks" definiert.
//  Objekt-Typen:
//    'spike'    – Stachel (tödlich, am Boden)
//    'spikeUp'  – Stachel an der Decke
//    'block'    – Solider Block (mit Hitbox)
//    'platform' – Schwebende Plattform
//    'orbYellow'– Gelber Sprungring (muss im Flug gedrückt werden)
//    'padYellow'– Gelbes Sprungpolster (auto-jump)
//    'portalShip'– Ship-Portal
//    'portalCube'– Cube-Portal
//    'coin'     – Geheimmünze
// ============================================================

function createLevelData() {
    return [
        // ===== LEVEL 0: STEREO MADNESS =====
        {
            name: 'Stereo Madness',
            bgColor: '#1a1a3e',
            groundColor: '#2c3e50',
            difficulty: 1,
            length: 3200,
            objects: [
                // Startbereich – einzelne Stachel
                {type:'spike', x:400, y:GROUND_Y-30},
                {type:'spike', x:640, y:GROUND_Y-30},
                {type:'spike', x:880, y:GROUND_Y-30},
                {type:'spike', x:1120, y:GROUND_Y-30},

                // Doppel-Stachel
                {type:'spike', x:1360, y:GROUND_Y-30},
                {type:'spike', x:1360+BLOCK_SIZE, y:GROUND_Y-30},

                // Treppe (30% – Stereo Madness Charakteristikum)
                {type:'block', x:1680, y:GROUND_Y-40},
                {type:'block', x:1720, y:GROUND_Y-80},
                {type:'block', x:1760, y:GROUND_Y-120},
                {type:'block', x:1800, y:GROUND_Y-160},

                // Stachel nach der Treppe
                {type:'spike', x:1960, y:GROUND_Y-30},

                // Ship-Portal bei ~45%
                {type:'portalShip', x:2200, y:GROUND_Y-100},

                // Ship-Bereich: enge Korridore
                {type:'block', x:2400, y:GROUND_Y-120, w:BLOCK_SIZE*3, h:BLOCK_SIZE},
                {type:'block', x:2400, y:GROUND_Y-240, w:BLOCK_SIZE*3, h:BLOCK_SIZE},
                {type:'block', x:2700, y:GROUND_Y-80, w:BLOCK_SIZE*2, h:BLOCK_SIZE},
                {type:'block', x:2700, y:GROUND_Y-200, w:BLOCK_SIZE*2, h:BLOCK_SIZE},

                // Zurück zu Cube
                {type:'portalCube', x:3000, y:GROUND_Y-100},

                // Endspurt
                {type:'spike', x:3150, y:GROUND_Y-30},
            ]
        },

        // ===== LEVEL 1: BACK ON TRACK =====
        {
            name: 'Back on Track',
            bgColor: '#1a2a1e',
            groundColor: '#2a4a2e',
            difficulty: 2,
            length: 3400,
            objects: [
                // Start mit Doppel-Stachel
                {type:'spike', x:400, y:GROUND_Y-30},
                {type:'spike', x:440, y:GROUND_Y-30},

                // Plattformen
                {type:'platform', x:700, y:GROUND_Y-80, w:120},
                {type:'platform', x:900, y:GROUND_Y-120, w:100},

                // Stachel auf Plattform
                {type:'spike', x:920, y:GROUND_Y-150},

                // Gelbes Sprungpolster (neu in Back on Track)
                {type:'padYellow', x:1200, y:GROUND_Y-30},

                // Nach dem Pad: höhere Plattform
                {type:'platform', x:1300, y:GROUND_Y-180, w:120},
                {type:'spike', x:1340, y:GROUND_Y-210},

                // Ship-Portal (mehr Ship als Cube)
                {type:'portalShip', x:1600, y:GROUND_Y-100},

                // Ship-Bereich: Zickzack
                {type:'block', x:1800, y:GROUND_Y-60, w:BLOCK_SIZE, h:BLOCK_SIZE},
                {type:'block', x:1900, y:GROUND_Y-140, w:BLOCK_SIZE, h:BLOCK_SIZE},
                {type:'block', x:2000, y:GROUND_Y-60, w:BLOCK_SIZE, h:BLOCK_SIZE},
                {type:'block', x:2100, y:GROUND_Y-180, w:BLOCK_SIZE, h:BLOCK_SIZE},

                // Zurück zu Cube
                {type:'portalCube', x:2400, y:GROUND_Y-100},

                // Cube: Plattform mit Stachel
                {type:'platform', x:2550, y:GROUND_Y-60, w:100},
                {type:'spike', x:2580, y:GROUND_Y-90},

                // Endbereich: Gelbe Pads als Gefahr
                {type:'padYellow', x:2800, y:GROUND_Y-30},
                {type:'spike', x:2950, y:GROUND_Y-30},
                {type:'spike', x:2990, y:GROUND_Y-30},

                // Letzter Sprung
                {type:'platform', x:3150, y:GROUND_Y-100, w:150},
            ]
        },

        // ===== LEVEL 2: POLARGEIST =====
        {
            name: 'Polargeist',
            bgColor: '#1a1a2e',
            groundColor: '#3a2a4e',
            difficulty: 3,
            length: 3600,
            objects: [
                // Start mit einzelnen Stachel
                {type:'spike', x:400, y:GROUND_Y-30},
                {type:'spike', x:600, y:GROUND_Y-30},

                // Gelbe Sprungringe (neu in Polargeist)
                {type:'orbYellow', x:850, y:GROUND_Y-120},
                {type:'orbYellow', x:1000, y:GROUND_Y-140},
                {type:'orbYellow', x:1150, y:GROUND_Y-160},

                // Grube
                {type:'spike', x:1000, y:GROUND_Y-10},
                {type:'spike', x:1100, y:GROUND_Y-10},

                // Landeplattform
                {type:'platform', x:1300, y:GROUND_Y-80, w:120},

                // Ship-Portal bei ~34%
                {type:'portalShip', x:1500, y:GROUND_Y-100},

                // Ship: enger Zickzack-Korridor
                {type:'block', x:1700, y:GROUND_Y-80, w:BLOCK_SIZE*2, h:BLOCK_SIZE},
                {type:'block', x:1700, y:GROUND_Y-240, w:BLOCK_SIZE*2, h:BLOCK_SIZE},
                {type:'block', x:1900, y:GROUND_Y-120, w:BLOCK_SIZE, h:BLOCK_SIZE},
                {type:'block', x:1900, y:GROUND_Y-280, w:BLOCK_SIZE, h:BLOCK_SIZE},
                {type:'block', x:2050, y:GROUND_Y-60, w:BLOCK_SIZE*2, h:BLOCK_SIZE},
                {type:'block', x:2050, y:GROUND_Y-220, w:BLOCK_SIZE*2, h:BLOCK_SIZE},

                // Zurück zu Cube bei ~47%
                {type:'portalCube', x:2300, y:GROUND_Y-100},

                // Zweite Cube-Sequenz – schwieriger
                {type:'spike', x:2450, y:GROUND_Y-30},
                {type:'spike', x:2500, y:GROUND_Y-30},

                // Plattformen mit Stacheln
                {type:'platform', x:2650, y:GROUND_Y-70, w:80},
                {type:'spike', x:2670, y:GROUND_Y-100},
                {type:'platform', x:2800, y:GROUND_Y-130, w:80},
                {type:'spike', x:2820, y:GROUND_Y-160},

                // Letzter Sprungring
                {type:'orbYellow', x:3000, y:GROUND_Y-140},

                // Endspurt: Treppe
                {type:'block', x:3200, y:GROUND_Y-40},
                {type:'block', x:3240, y:GROUND_Y-80},
                {type:'block', x:3280, y:GROUND_Y-120},
                {type:'spike', x:3400, y:GROUND_Y-30},
            ]
        }
    ];
}

const LEVELS = createLevelData();

// ============================================================
//  SPIELER
// ============================================================
function createPlayer() {
    return {
        x: 120,
        y: GROUND_Y - PLAYER_SIZE,
        width: PLAYER_SIZE,
        height: PLAYER_SIZE,
        vy: 0,
        gravity: 0.9,
        jumpForce: -11,
        onGround: true,
        mode: 'cube',           // 'cube' oder 'ship'
        rotation: 0,
        targetRotation: 0,
        isJumping: false,
        shipHold: false,
        // Trail
        trail: []
    };
}

// ============================================================
//  LEVEL LADEN
// ============================================================
function loadLevel(index) {
    currentLevel = index;
    levelConfig = LEVELS[index];
    levelLength = levelConfig.length;

    // Entities aus Level-Daten klonen
    entities = levelConfig.objects.map(o => ({...o}));

    // Spieler neu erstellen
    player = createPlayer();

    // Zustand zurücksetzen
    cameraX = 0;
    frameCounter = 0;
    progress = 0;
    particles = [];
    trailParticles = [];
    gameState = 'playing';
    deathTimer = 0;

    // HUD anzeigen
    menuEl.classList.add('hidden');
    hudEl.style.display = 'flex';
    progressContainer.style.display = 'block';
    backBtn.style.display = 'block';
    deathScreen.classList.add('hidden');

    updateHUD();
}

// ============================================================
//  MENÜ
// ============================================================
document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.level);
        attempts = 1;
        loadLevel(idx);
    });
});

backBtn.addEventListener('click', () => {
    gameState = 'menu';
    menuEl.classList.remove('hidden');
    hudEl.style.display = 'none';
    progressContainer.style.display = 'none';
    backBtn.style.display = 'none';
    deathScreen.classList.add('hidden');
});

// ============================================================
//  EINGABE
// ============================================================
let inputPressed = false;

function handleJump() {
    if (gameState === 'dead') {
        // Neustart
        attempts++;
        loadLevel(currentLevel);
        return;
    }
    if (gameState !== 'playing') return;

    if (player.mode === 'cube') {
        if (player.onGround) {
            player.vy = player.jumpForce;
            player.onGround = false;
            player.isJumping = true;
            player.targetRotation = Math.PI / 2;
        }
    } else if (player.mode === 'ship') {
        player.shipHold = true;
    }
}

function handleRelease() {
    player.shipHold = false;
    player.isJumping = false;
}

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!inputPressed) {
            inputPressed = true;
            handleJump();
        }
    }
});

document.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        inputPressed = false;
        handleRelease();
    }
});

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!inputPressed) {
        inputPressed = true;
        handleJump();
    }
});

canvas.addEventListener('pointerup', (e) => {
    e.preventDefault();
    inputPressed = false;
    handleRelease();
});

canvas.addEventListener('pointercancel', (e) => {
    inputPressed = false;
    handleRelease();
});

// ============================================================
//  KOLLISION (AABB)
// ============================================================
function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
    if (gameState !== 'playing') {
        if (gameState === 'dead') {
            deathTimer++;
            if (deathTimer > 30) {
                // Automatischer Neustart nach kurzer Zeit
                attempts++;
                loadLevel(currentLevel);
            }
        }
        return;
    }

    frameCounter++;
    bgPulse += 0.02;

    // --- Spieler-Physik ---
    if (player.mode === 'cube') {
        player.vy += player.gravity;
        player.y += player.vy;

        // Boden-Kollision
        if (player.y + player.height >= GROUND_Y) {
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.onGround = true;
            if (player.isJumping) {
                player.targetRotation = 0;
            }
        } else {
            player.onGround = false;
        }

        // Rotation
        if (!player.onGround) {
            player.rotation += 0.12;
        } else {
            // Sanft zur 0 drehen
            player.rotation *= 0.8;
            if (Math.abs(player.rotation) < 0.01) player.rotation = 0;
        }

        // Decke
        if (player.y < CEILING_Y) {
            player.y = CEILING_Y;
            player.vy = 0;
        }

    } else if (player.mode === 'ship') {
        // Ship-Physik: Schwerkraft sanfter, Schub bei Halten
        if (player.shipHold) {
            player.vy -= 0.8;
        } else {
            player.vy += 0.35;
        }
        player.vy = Math.max(-8, Math.min(8, player.vy));
        player.y += player.vy;

        // Decke und Boden
        if (player.y < CEILING_Y) { player.y = CEILING_Y; player.vy = 0; }
        if (player.y + player.height > GROUND_Y) {
            player.y = GROUND_Y - player.height;
            player.vy = 0;
        }
        player.rotation = player.vy * 0.05;
    }

    // --- Kamera ---
    cameraX += gameSpeed;

    // --- Fortschritt ---
    progress = Math.min(100, (cameraX / levelLength) * 100);
    updateHUD();

    // --- Trail-Partikel ---
    if (frameCounter % 2 === 0) {
        trailParticles.push({
            x: player.x + (player.mode === 'ship' ? 0 : player.width/2),
            y: player.y + player.height/2,
            life: 1,
            size: player.mode === 'ship' ? 6 : 8,
            color: player.mode === 'ship' ? '#5ecf7a' : '#fcc02a'
        });
    }

    trailParticles.forEach(p => p.life -= 0.04);
    trailParticles = trailParticles.filter(p => p.life > 0);

    // --- Entities aktualisieren ---
    entities.forEach(e => {
        // Sichtbarkeit: nur im Kamera-Bereich zeichnen
        e.screenX = e.x - cameraX;
    });

    // --- Kollisionen prüfen ---
    const playerRect = {
        x: player.x,
        y: player.y,
        w: player.width,
        h: player.height
    };

    for (let e of entities) {
        if (e.screenX < -200 || e.screenX > canvas.width + 200) continue;

        const ex = e.x - cameraX;
        let rect;

        // Kollisionsbox je nach Typ
        switch(e.type) {
            case 'spike':
                rect = { x: ex + 8, y: e.y + 8, w: BLOCK_SIZE - 16, h: 30 };
                break;
            case 'spikeUp':
                rect = { x: ex + 8, y: e.y, w: BLOCK_SIZE - 16, h: 30 };
                break;
            case 'block':
                rect = { x: ex, y: e.y, w: e.w || BLOCK_SIZE, h: e.h || BLOCK_SIZE };
                break;
            case 'platform':
                rect = { x: ex, y: e.y, w: e.w || BLOCK_SIZE, h: 12 };
                break;
            case 'orbYellow':
                // Orb-Kollision (Kreis)
                const orbCX = ex + 20;
                const orbCY = e.y + 20;
                const orbR = 28;
                const dx = (player.x + player.width/2) - orbCX;
                const dy = (player.y + player.height/2) - orbCY;
                if (Math.sqrt(dx*dx + dy*dy) < orbR + 15) {
                    if (inputPressed) {
                        player.vy = -12;
                        player.onGround = false;
                        // Orb-Partikel
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: orbCX, y: orbCY,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 0.8,
                                color: '#fcc02a',
                                size: 4
                            });
                        }
                    }
                }
                continue; // Orb hat keine Standard-Kollision
            case 'padYellow':
                rect = { x: ex, y: e.y + 20, w: BLOCK_SIZE, h: 20 };
                if (rectsOverlap(playerRect, rect)) {
                    player.vy = -16;
                    player.onGround = false;
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: ex + 20, y: e.y + 30,
                            vx: (Math.random() - 0.5) * 6,
                            vy: -Math.random() * 8,
                            life: 0.7,
                            color: '#fcc02a',
                            size: 5
                        });
                    }
                }
                continue;
            case 'portalShip':
                rect = { x: ex + 10, y: e.y, w: 20, h: 80 };
                if (rectsOverlap(playerRect, rect)) {
                    player.mode = 'ship';
                    player.vy = 0;
                }
                continue;
            case 'portalCube':
                rect = { x: ex + 10, y: e.y, w: 20, h: 80 };
                if (rectsOverlap(playerRect, rect)) {
                    player.mode = 'cube';
                    player.vy = 0;
                }
                continue;
            case 'coin':
                // Geheimmünzen (optional)
                continue;
        }

        if (rect && rectsOverlap(playerRect, rect)) {
            if (e.type === 'spike' || e.type === 'spikeUp') {
                die();
            } else if (e.type === 'block' || e.type === 'platform') {
                // Bei Block-Kollision: prüfen ob von oben oder Seite
                const prevY = player.y - player.vy;
                if (prevY + player.height <= rect.y + 5) {
                    // Von oben gelandet
                    player.y = rect.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                } else if (player.vy < 0 && prevY >= rect.y + rect.h - 5) {
                    // Von unten
                    player.y = rect.y + rect.h;
                    player.vy = 0;
                } else {
                    // Seite
                    die();
                }
            }
        }
    }

    // Boden-Kollision (fest)
    if (player.y + player.height > GROUND_Y) {
        player.y = GROUND_Y - player.height;
        player.vy = 0;
        player.onGround = true;
    }

    // Level-Ende erreicht?
    if (cameraX >= levelLength) {
        gameState = 'complete';
        progress = 100;
        updateHUD();
        deathScreen.classList.remove('hidden');
        deathScreen.querySelector('.text').textContent = '🏆 Level geschafft!';
        deathScreen.querySelector('.sub').textContent = 'Klicke für Menü';
        deathScreen.style.background = 'rgba(0, 100, 0, 0.3)';
        // Klick zum Menü
        const goMenu = () => {
            deathScreen.classList.add('hidden');
            gameState = 'menu';
            menuEl.classList.remove('hidden');
            hudEl.style.display = 'none';
            progressContainer.style.display = 'none';
            backBtn.style.display = 'none';
            deathScreen.removeEventListener('click', goMenu);
        };
        deathScreen.addEventListener('click', goMenu);
    }

    // Partikel
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.03;
    });
    particles = particles.filter(p => p.life > 0);
}

function die() {
    if (gameState !== 'playing') return;
    gameState = 'dead';
    deathTimer = 0;
    deathScreen.classList.remove('hidden');
    deathScreen.style.background = 'rgba(200, 0, 0, 0.3)';
    deathScreen.querySelector('.text').textContent = '💀 Game Over';
    deathScreen.querySelector('.sub').textContent = 'Versuch ' + attempts + ' – Klicke zum Neustart';

    // Todes-Partikel
    for (let i = 0; i < 25; i++) {
        particles.push({
            x: player.x + player.width/2,
            y: player.y + player.height/2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12 - 3,
            life: 1,
            color: i % 3 === 0 ? '#ef4444' : (i % 3 === 1 ? '#fcc02a' : '#ffffff'),
            size: Math.random() * 5 + 3
        });
    }
}

function updateHUD() {
    attemptsEl.textContent = 'Versuch: ' + attempts;
    percentageEl.textContent = Math.round(progress) + '%';
    progressBar.style.width = progress + '%';
}

// ============================================================
//  RENDERING
// ============================================================
function draw() {
    if (gameState === 'menu') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
    }

    // Hintergrund
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, levelConfig.bgColor);
    grad.addColorStop(1, '#0f0f1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Pulsierender Hintergrund-Effekt
    const pulseAlpha = 0.03 + Math.sin(bgPulse) * 0.02;
    ctx.fillStyle = `rgba(94, 207, 122, ${pulseAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- Boden ---
    ctx.fillStyle = levelConfig.groundColor || '#2c3e50';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

    // Boden-Linie (leuchtend)
    ctx.strokeStyle = '#5ecf7a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    // Boden-Gitter
    ctx.strokeStyle = 'rgba(94, 207, 122, 0.1)';
    ctx.lineWidth = 1;
    for (let x = -(cameraX % 40); x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    // --- Entities zeichnen ---
    entities.forEach(e => {
        const ex = e.x - cameraX;
        if (ex < -100 || ex > canvas.width + 100) return;

        switch(e.type) {
            case 'spike':
                drawSpike(ex, e.y);
                break;
            case 'spikeUp':
                drawSpikeUp(ex, e.y);
                break;
            case 'block':
                drawBlock(ex, e.y, e.w || BLOCK_SIZE, e.h || BLOCK_SIZE);
                break;
            case 'platform':
                drawPlatform(ex, e.y, e.w || BLOCK_SIZE);
                break;
            case 'orbYellow':
                drawOrb(ex, e.y);
                break;
            case 'padYellow':
                drawPad(ex, e.y);
                break;
            case 'portalShip':
                drawPortal(ex, e.y, '#5ecf7a', 'S');
                break;
            case 'portalCube':
                drawPortal(ex, e.y, '#fcc02a', 'C');
                break;
        }
    });

    // --- Trail-Partikel ---
    trailParticles.forEach(p => {
        ctx.globalAlpha = p.life * 0.6;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // --- Explosions-Partikel ---
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // --- Spieler zeichnen ---
    drawPlayer();

    // --- Decke (unsichtbare Barriere, aber visuell dezent) ---
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(0, 0, canvas.width, 4);
}

function drawSpike(x, y) {
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(x + BLOCK_SIZE/2, y);
    ctx.lineTo(x + BLOCK_SIZE, y + BLOCK_SIZE);
    ctx.lineTo(x, y + BLOCK_SIZE);
    ctx.closePath();
    ctx.fill();
    // Glow
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawSpikeUp(x, y) {
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + BLOCK_SIZE, y);
    ctx.lineTo(x + BLOCK_SIZE/2, y + BLOCK_SIZE);
    ctx.closePath();
    ctx.fill();
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawBlock(x, y, w, h) {
    ctx.fillStyle = '#4b5563';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.roundRect(x + 2, y + 2, w - 4, h/2 - 2, 3);
    ctx.fill();
    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.stroke();
}

function drawPlatform(x, y, w) {
    ctx.fillStyle = '#6b7280';
    ctx.beginPath();
    ctx.roundRect(x, y, w, 12, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(94, 207, 122, 0.3)';
    ctx.fillRect(x, y + 10, w, 3);
}

function drawOrb(x, y) {
    // Äußerer Ring
    ctx.strokeStyle = '#fcc02a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x + 20, y + 20, 18, 0, Math.PI * 2);
    ctx.stroke();
    // Innerer Ring
    ctx.strokeStyle = 'rgba(252, 192, 42, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + 20, y + 20, 10, 0, Math.PI * 2);
    ctx.stroke();
    // Glow
    ctx.shadowColor = '#fcc02a';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(x + 20, y + 20, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fcc02a';
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawPad(x, y) {
    ctx.fillStyle = '#fcc02a';
    ctx.beginPath();
    ctx.roundRect(x + 5, y + 25, 30, 10, 5);
    ctx.fill();
    ctx.shadowColor = '#fcc02a';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawPortal(x, y, color, letter) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(x + 20, y + 40, 15, 40, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(letter, x + 20, y + 46);
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.width/2, player.y + player.height/2);
    ctx.rotate(player.rotation);

    if (player.mode === 'cube') {
        // Cube
        ctx.fillStyle = '#fcc02a';
        ctx.beginPath();
        ctx.roundRect(-player.width/2, -player.height/2, player.width, player.height, 6);
        ctx.fill();

        // Gesicht / Inneres Quadrat
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.roundRect(-player.width/2 + 6, -player.height/2 + 6, player.width - 12, player.height - 12, 4);
        ctx.fill();

        // Augen
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(-5, -3, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(5, -3, 4, 0, Math.PI * 2);
        ctx.fill();

        // Glow
        ctx.shadowColor = '#fcc02a';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.roundRect(-player.width/2, -player.height/2, player.width, player.height, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

    } else {
        // Ship (Dreieck-Form)
        ctx.fillStyle = '#5ecf7a';
        ctx.beginPath();
        ctx.moveTo(-player.width/2, 0);
        ctx.lineTo(player.width/2, -player.height/2);
        ctx.lineTo(player.width/2, player.height/2);
        ctx.closePath();
        ctx.fill();

        // Cockpit
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(-2, 0, 6, 0, Math.PI * 2);
        ctx.fill();

        // Glow
        ctx.shadowColor = '#5ecf7a';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(-player.width/2, 0);
        ctx.lineTo(player.width/2, -player.height/2);
        ctx.lineTo(player.width/2, player.height/2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Trail
    if (player.mode === 'ship') {
        ctx.fillStyle = 'rgba(94, 207, 122, 0.3)';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y + player.height/2);
        ctx.lineTo(player.x - 30, player.y + player.height/2 - 8);
        ctx.lineTo(player.x - 30, player.y + player.height/2 + 8);
        ctx.closePath();
        ctx.fill();
    }
}

// ============================================================
//  HAUPTSCHLEIFE
// ============================================================
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================
//  START
// ============================================================
resizeCanvas();
gameLoop();
</script>
</body>
</html>
