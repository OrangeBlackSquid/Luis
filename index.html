<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a2980, #26d0ce);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
        }

        /* Sanfte Farbanimation */
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Schwebende Lichtblasen im Hintergrund */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 0;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #8e2de2;
            top: -100px;
            left: -100px;
            animation: float1 12s ease-in-out infinite;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #00c6ff;
            bottom: -150px;
            right: -100px;
            animation: float2 14s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(80px, 60px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50%      { transform: translate(-70px, -50px); }
        }

        /* Der Text in der Mitte */
        .content {
            position: relative;
            z-index: 1;
            color: #ffffff;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-align: center;
            padding: 2rem 3rem;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.5),
                         0 0 50px rgba(0, 198, 255, 0.4);
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="content">Moin Luis, ich habe eine Stunde meiner Lebenszeit geopfert um diese Website für dich zu coden.</div>
</body>
</html>
