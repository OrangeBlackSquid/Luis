<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>typing.challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lexend+Deca:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #323437;
    --bg-sub: #2c2e31;
    --bg-sub-alt: #262829;
    --sub: #646669;
    --sub-alt: #4a4d51;
    --text: #d1d0c5;
    --main: #e2b714;
    --error: #ca4754;
    --error-extra: #7e2a33;
    --caret: #e2b714;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', 'Courier New', monospace;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    overscroll-behavior:none;
  }

  #app {
    position:relative; width:100vw; height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* ============ TOP BAR ============ */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    gap:12px;
    flex-shrink:0;
  }

  .logo {
    display:flex; align-items:baseline; gap:2px;
    font-family:'Lexend Deca', 'JetBrains Mono', sans-serif;
    cursor:default;
  }
  .logo .logo-icon {
    font-size:20px; color:var(--main);
    margin-right:6px; line-height:1;
  }
  .logo .logo-main {
    font-size:20px; font-weight:700;
    color:var(--text); line-height:1;
  }
  .logo .logo-dot {
    font-size:20px; font-weight:700;
    color:var(--main); line-height:1;
  }
  .logo .logo-tail {
    font-size:14px; color:var(--sub);
    margin-left:4px; line-height:1;
  }

  .stats {
    display:flex; align-items:center; gap:20px;
    font-family:'Lexend Deca', sans-serif;
  }
  .stat {
    display:flex; flex-direction:column;
    line-height:1.1; min-width:46px;
  }
  .stat .val {
    font-size:20px; font-weight:400;
    color:var(--main);
    font-variant-numeric:tabular-nums;
  }
  .stat .lbl {
    font-size:9px; letter-spacing:1.5px;
    text-transform:lowercase;
    color:var(--sub); margin-top:2px;
  }

  /* ============ MAIN ============ */
  main {
    flex:1;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:20px 24px;
    position:relative;
    overflow:hidden;
  }

  /* ============ SINGLE WORD DISPLAY ============ */
  #wordDisplay {
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(28px, 9vw, 68px);
    font-weight:500;
    letter-spacing:1px;
    line-height:1.25;
    text-align:center;
    word-break:break-word;
    max-width:100%;
    padding:20px 10px;
    transition:transform .15s;
    color:var(--sub);
  }

  #wordDisplay .letter {
    display:inline-block;
    position:relative;
    color:var(--sub);
    transition:color .08s;
  }
  #wordDisplay .letter.correct {
    color:var(--text);
  }
  #wordDisplay .letter.wrong {
    color:var(--error);
    text-decoration:underline;
    text-decoration-color:var(--error);
    text-underline-offset:6px;
    text-decoration-thickness:3px;
  }
  #wordDisplay .letter.extra {
    color:var(--error-extra);
    text-decoration:underline;
    text-decoration-color:var(--error-extra);
    text-underline-offset:6px;
    text-decoration-thickness:3px;
  }

  /* Caret */
  #wordDisplay .letter.caret::before {
    content:'';
    position:absolute;
    left:-3px;
    top:0.05em;
    width:3px;
    height:1.05em;
    background:var(--caret);
    border-radius:1.5px;
    animation:caretBlink 1s steps(1) infinite;
    pointer-events:none;
  }
  @keyframes caretBlink {
    0%, 49% { opacity:1; }
    50%, 100% { opacity:0.15; }
  }

  /* Complete flash */
  #wordDisplay.complete {
    animation:completePop .4s ease-out;
  }
  @keyframes completePop {
    0%   { transform:scale(1); }
    40%  { transform:scale(1.06); color:var(--main); }
    100% { transform:scale(1); }
  }

  /* Shake */
  #wordDisplay.shake {
    animation:shake .3s ease-in-out;
  }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    20%,60% { transform:translateX(-8px); }
    40%,80% { transform:translateX(8px); }
  }

  /* ============ PROGRESS BAR ============ */
  .progress-wrap {
    width:100%; max-width:600px;
    padding:0 10px;
    margin-top:36px;
  }
  .progress-bar {
    width:100%; height:3px;
    background:var(--bg-sub);
    border-radius:2px;
    overflow:hidden;
  }
  #progressFill {
    height:100%; width:0%;
    background:var(--main);
    border-radius:2px;
    transition:width .3s ease;
  }
  .progress-label {
    text-align:center;
    margin-top:10px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--sub-alt);
    font-family:'Lexend Deca', sans-serif;
    text-transform:lowercase;
  }

  /* ============ FOOTER ============ */
  .footer {
    padding:14px 20px 20px;
    display:flex;
    justify-content:center;
    gap:20px;
    font-family:'Lexend Deca', sans-serif;
    font-size:11px;
    color:var(--sub-alt);
    letter-spacing:.5px;
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .footer .hint {
    display:flex; align-items:center; gap:6px;
  }
  .footer kbd {
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--bg-sub);
    color:var(--sub);
    padding:3px 8px; border-radius:4px;
    font-family:inherit; font-size:10px;
    letter-spacing:1px; min-width:22px;
  }

  /* ============ MENU OVERLAY ============ */
  #menuOverlay {
    position:absolute; inset:0;
    background:var(--bg);
    z-index:50;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    gap:22px;
    padding:24px;
    transition:opacity .2s;
  }
  #menuOverlay.hidden { display:none; }

  #menuOverlay .menu-logo {
    font-family:'Lexend Deca', sans-serif;
    font-size:38px;
    font-weight:700;
    color:var(--text);
    letter-spacing:1px;
    display:flex;
    align-items:baseline;
  }
  #menuOverlay .menu-logo .accent { color:var(--main); }
  #menuOverlay .menu-logo .dot { color:var(--main); }
  #menuOverlay .menu-logo .tail {
    font-size:18px;
    color:var(--sub);
    font-family:'JetBrains Mono', monospace;
    margin-left:8px;
  }

  #menuOverlay .menu-subtitle {
    font-family:'Lexend Deca', sans-serif;
    color:var(--sub);
    font-size:12px;
    letter-spacing:2px;
    text-transform:lowercase;
    margin-top:-10px;
  }

  .menu-config {
    display:flex; flex-direction:column;
    gap:8px;
    width:100%; max-width:340px;
    margin-top:8px;
  }

  .cfg-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--bg-sub);
    border:1px solid transparent;
    border-radius:8px;
    padding:14px 18px;
    cursor:pointer;
    transition:all .15s;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    text-align:left;
  }
  .cfg-row:hover, .cfg-row:active {
    background:var(--bg-sub-alt);
    border-color:var(--main);
  }
  .cfg-row .cfg-name {
    font-family:'Lexend Deca', sans-serif;
    font-weight:700;
    letter-spacing:1px;
    text-transform:lowercase;
  }
  .cfg-row .cfg-stars {
    color:var(--main);
    font-size:14px;
    letter-spacing:2px;
  }
  .cfg-row .cfg-desc {
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--sub);
    font-weight:400;
    letter-spacing:0;
    margin-top:3px;
    text-transform:none;
  }

  /* ============ RESULTS ============ */
  #resultsOverlay {
    position:absolute; inset:0;
    background:var(--bg);
    z-index:60;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    gap:20px;
    padding:30px 20px;
  }
  #resultsOverlay.hidden { display:none; }

  .results-title {
    font-family:'Lexend Deca', sans-serif;
    font-size:24px;
    font-weight:400;
    color:var(--sub);
    letter-spacing:2px;
    text-transform:lowercase;
    margin-bottom:8px;
  }

  .results-grid {
    display:flex; flex-wrap:wrap;
    justify-content:center;
    gap:30px 44px;
    margin:16px 0;
    max-width:500px;
  }
  .results-item { text-align:center; }
  .results-item .label {
    font-family:'Lexend Deca', sans-serif;
    color:var(--sub);
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:lowercase;
    margin-bottom:6px;
  }
  .results-item .value {
    font-family:'JetBrains Mono', monospace;
    color:var(--main);
    font-size:48px;
    font-weight:400;
    line-height:1;
  }
  .results-item .value.small {
    font-size:28px;
  }
  .results-item .unit {
    color:var(--sub);
    font-size:12px;
    margin-left:3px;
  }

  .results-buttons {
    display:flex; gap:12px;
    margin-top:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .results-btn {
    background:transparent;
    border:1px solid var(--sub-alt);
    color:var(--sub);
    padding:11px 24px;
    border-radius:6px;
    font-family:inherit;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
    transition:all .15s;
  }
  .results-btn:hover, .results-btn:active {
    border-color:var(--main);
    color:var(--main);
  }
  .results-btn.primary {
    background:var(--main);
    color:var(--bg);
    border-color:var(--main);
  }
  .results-btn.primary:hover { background:#f0c930; }

  /* ============ HIDDEN INPUT ============ */
  #hiddenInput {
    position:fixed;
    top:50%; left:50%;
    width:1px; height:1px;
    opacity:0.01;
    border:none; outline:none; background:transparent;
    color:transparent; caret-color:transparent;
    font-size:16px;
    pointer-events:none;
    z-index:-1;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 700px) {
    .topbar { padding:12px 16px; }
    .logo .logo-icon { font-size:18px; }
    .logo .logo-main, .logo .logo-dot { font-size:18px; }
    .logo .logo-tail { font-size:12px; }
    .stat .val { font-size:17px; }
    .stat .lbl { font-size:8px; letter-spacing:1px; }
    .stats { gap:14px; }
    main { padding:14px 16px; }
    #wordDisplay { padding:14px 6px; }
    .progress-wrap { margin-top:24px; padding:0; }
    .footer { padding:10px 14px 14px; gap:14px; font-size:10px; }
    #menuOverlay { gap:18px; padding:20px; }
    #menuOverlay .menu-logo { font-size:30px; }
    #menuOverlay .menu-logo .tail { font-size:14px; }
    .cfg-row { padding:12px 16px; font-size:14px; }
    .cfg-row .cfg-stars { font-size:12px; letter-spacing:1.5px; }
    .results-grid { gap:22px 32px; }
    .results-item .value { font-size:38px; }
    .results-item .value.small { font-size:22px; }
  }

  @media (max-height: 500px) {
    #wordDisplay { padding:8px 6px; }
    .progress-wrap { margin-top:14px; }
    .footer { padding:6px 14px 10px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">⌨</span>
      <span class="logo-main">typing</span>
      <span class="logo-dot">.</span>
      <span class="logo-tail">challenge</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="val" id="statWpm">0</span><span class="lbl">wpm</span></div>
      <div class="stat"><span class="val" id="statAcc">100%</span><span class="lbl">acc</span></div>
      <div class="stat"><span class="val" id="statTime">0:00</span><span class="lbl">time</span></div>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div id="wordDisplay"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-label"><span id="progressLabel">1 / 25</span></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="hint"><kbd>esc</kbd>quit</div>
    <div class="hint"><kbd>tab</kbd>restart</div>
  </footer>

  <!-- MENU OVERLAY -->
  <div id="menuOverlay">
    <div class="menu-logo">

    </div>

          <span class="cfg-desc">komplexe begriffe</span>
        </span>
        <span class="cfg-stars">★★★</span>
      </button>
      <button class="cfg-row" data-diff="unmöglich">
        <span>
          <span class="cfg-name">unmöglich</span>
          <span class="cfg-desc">bürokratie-monster</span>
        </span>
        <span class="cfg-stars">★★★★</span>
      </button>
    </div>
  </div>

  <!-- RESULTS OVERLAY -->
  <div id="resultsOverlay" class="hidden">
    <div class="results-title">session complete</div>
    <div class="results-grid">
      <div class="results-item">
        <div class="label">wpm</div>
        <div class="value" id="resWpm">0</div>
      </div>
      <div class="results-item">
        <div class="label">accuracy</div>
        <div class="value" id="resAcc">100%</div>
      </div>
      <div class="results-item">
        <div class="label">chars</div>
        <div class="value small" id="resChars">0</div>
      </div>
      <div class="results-item">
        <div class="label">time</div>
        <div class="value small" id="resTime">0s</div>
      </div>
    </div>
    <div class="results-buttons">
      <button class="results-btn" id="resRestart">restart</button>
      <button class="results-btn primary" id="resMenu">menu</button>
    </div>
  </div>

  <input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text">
</div>

// ============================================================
//  DIVERSITY-SHUFFLE
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSessionPool(allWords) {
  const groups = new Map();
  for (const w of allWords) {
    const key = w.toLowerCase().slice(0, 6);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  }
  let shuffledGroups = [];
  for (const g of groups.values()) shuffledGroups.push(shuffle(g));
  shuffledGroups = shuffle(shuffledGroups);
  const result = [];
  let round = 0, anyAdded = true;
  while (anyAdded) {
    anyAdded = false;
    for (const g of shuffledGroups) {
      if (round < g.length) { result.push(g[round]); anyAdded = true; }
    }
    round++;
  }
  return result;
}

// ============================================================
//  STATE
// ============================================================
const SESSION_LENGTH = 25;

const state = {
  difficulty: 'einfach',
  wordPool: [],
  currentIndex: 0,
  currentWord: '',
  input: '',
  lastInputLength: 0,
  wordsCompleted: 0,
  correctChars: 0,
  wrongChars: 0,
  startTime: 0,
  elapsed: 0,
  sessionComplete: false,
  playing: false,
  shakeTimeout: null,
};

// ============================================================
//  DOM
// ============================================================
const wordDisplayEl = document.getElementById('wordDisplay');
const hiddenInput = document.getElementById('hiddenInput');
const menuOverlay = document.getElementById('menuOverlay');
const resultsOverlay = document.getElementById('resultsOverlay');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const statWpm = document.getElementById('statWpm');
const statAcc = document.getElementById('statAcc');
const statTime = document.getElementById('statTime');
const resWpm = document.getElementById('resWpm');
const resAcc = document.getElementById('resAcc');
const resChars = document.getElementById('resChars');
const resTime = document.getElementById('resTime');
const resRestart = document.getElementById('resRestart');
const resMenu = document.getElementById('resMenu');

// ============================================================
//  HELPERS
// ============================================================
function escapeHtml(c) {
  if (c === '&') return '&amp;';
  if (c === '<') return '&lt;';
  if (c === '>') return '&gt;';
  return c;
}

function formatTime(sec) {
  const s = Math.floor(sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

// ============================================================
//  START
// ============================================================
function startGame(difficulty) {
  state.difficulty = difficulty;
  state.wordPool = buildSessionPool(WORDS[difficulty]);
  state.currentIndex = 0;
  state.currentWord = state.wordPool[0];
  state.input = '';
  state.lastInputLength = 0;
  state.wordsCompleted = 0;
  state.correctChars = 0;
  state.wrongChars = 0;
  state.startTime = performance.now();
  state.elapsed = 0;
  state.sessionComplete = false;
  state.playing = true;

  hiddenInput.value = '';
  menuOverlay.classList.add('hidden');
  resultsOverlay.classList.add('hidden');

  renderWord();
  updateStats();
  updateProgress();
  focusInput();
}

function focusInput() {
  setTimeout(() => {
    try { hiddenInput.focus({ preventScroll: true }); } catch(e) { hiddenInput.focus(); }
  }, 30);
}

// ============================================================
//  RENDER
// ============================================================
function renderWord() {
  const target = state.currentWord;
  const input = state.input;
  let html = '';

  for (let i = 0; i < target.length; i++) {
    let cls = 'letter';
    if (i < input.length) {
      if (input[i].toLowerCase() === target[i].toLowerCase()) {
        cls += ' correct';
      } else {
        cls += ' wrong';
      }
    } else if (i === input.length) {
      cls += ' caret';
    }
    html += '<span class="' + cls + '">' + escapeHtml(target[i]) + '</span>';
  }

  // extra chars beyond word length
  for (let i = target.length; i < input.length; i++) {
    html += '<span class="letter extra">' + escapeHtml(input[i]) + '</span>';
  }

  // caret at end when input has reached end of word
  if (input.length >= target.length) {
    html += '<span class="letter caret" style="width:0">&nbsp;</span>';
  }

  wordDisplayEl.innerHTML = html;
}

function updateProgress() {
  const pct = (state.wordsCompleted / SESSION_LENGTH) * 100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = Math.min(state.wordsCompleted + 1, SESSION_LENGTH) + ' / ' + SESSION_LENGTH;
}

// ============================================================
//  STATS
// ============================================================
function updateStats() {
  const total = state.correctChars + state.wrongChars;
  const acc = total === 0 ? 100 : Math.round((state.correctChars / total) * 100);
  const minutes = state.elapsed / 60;
  const wpm = minutes > 0.01 ? Math.round((state.correctChars / 5) / minutes) : 0;

  statWpm.textContent = wpm;
  statAcc.textContent = acc + '%';
  statTime.textContent = formatTime(state.elapsed);
}

function updateElapsed() {
  if (!state.playing || state.sessionComplete) return;
  state.elapsed = (performance.now() - state.startTime) / 1000;
}

// ============================================================
//  WORD COMPLETE
// ============================================================
function onWordComplete() {
  state.wordsCompleted++;

  if (state.wordsCompleted >= SESSION_LENGTH) {
    state.sessionComplete = true;
    state.playing = false;
    updateElapsed();
    updateStats();
    setTimeout(endGame, 400);
    return;
  }

  wordDisplayEl.classList.add('complete');

  state.currentIndex++;
  if (state.currentIndex + 8 >= state.wordPool.length) {
    state.wordPool = state.wordPool.concat(buildSessionPool(WORDS[state.difficulty]));
  }
  state.currentWord = state.wordPool[state.currentIndex];
  state.input = '';
  state.lastInputLength = 0;
  hiddenInput.value = '';

  setTimeout(() => {
    wordDisplayEl.classList.remove('complete');
    renderWord();
    updateStats();
    updateProgress();
  }, 200);
}

function endGame() {
  updateElapsed();
  const total = state.correctChars + state.wrongChars;
  const acc = total === 0 ? 100 : Math.round((state.correctChars / total) * 100);
  const minutes = state.elapsed / 60;
  const wpm = minutes > 0.01 ? Math.round((state.correctChars / 5) / minutes) : 0;

  resWpm.textContent = wpm;
  resAcc.textContent = acc + '%';
  resChars.innerHTML = '<span style="color:#5ecf7a">' + state.correctChars + '</span>' +
                       '<span style="color:#646669"> / </span>' +
                       '<span style="color:#ca4754">' + state.wrongChars + '</span>';
  resTime.textContent = formatTime(state.elapsed);

  resultsOverlay.classList.remove('hidden');
  hiddenInput.blur();
}

// ============================================================
//  INPUT
// ============================================================
hiddenInput.addEventListener('input', (e) => {
  if (state.sessionComplete || !state.playing) return;

  const val = e.target.value;
  const target = state.currentWord;

  // Char-Zählung
  if (val.length > state.lastInputLength) {
    for (let i = state.lastInputLength; i < val.length; i++) {
      if (i < target.length && val[i].toLowerCase() === target[i].toLowerCase()) {
        state.correctChars++;
      } else {
        state.wrongChars++;
      }
    }
  } else if (val.length < state.lastInputLength) {
    for (let i = val.length; i < state.lastInputLength; i++) {
      if (i < target.length && val[i].toLowerCase() === target[i].toLowerCase()) {
        state.correctChars = Math.max(0, state.correctChars - 1);
      } else {
        state.wrongChars = Math.max(0, state.wrongChars - 1);
      }
    }
  }

  // shake on newly typed wrong char
  if (val.length > state.lastInputLength) {
    const lastIdx = val.length - 1;
    if (lastIdx < target.length && val[lastIdx].toLowerCase() !== target[lastIdx].toLowerCase()) {
      if (state.shakeTimeout) clearTimeout(state.shakeTimeout);
      wordDisplayEl.classList.add('shake');
      state.shakeTimeout = setTimeout(() => wordDisplayEl.classList.remove('shake'), 320);
    }
  }

  state.lastInputLength = val.length;
  state.input = val;

  // Wort komplett?
  if (val.toLowerCase() === target.toLowerCase()) {
    renderWord();
    onWordComplete();
    return;
  }

  renderWord();
  updateStats();
});

hiddenInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') e.preventDefault();
  if (e.key === 'Tab') {
    e.preventDefault();
    if (state.playing) restart();
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (state.playing) backToMenu();
  }
});

// ============================================================
//  FLOW
// ============================================================
function restart() {
  startGame(state.difficulty);
}

function backToMenu() {
  state.playing = false;
  state.sessionComplete = true;
  state.input = '';
  state.currentWord = '';
  wordDisplayEl.innerHTML = '';
  resultsOverlay.classList.add('hidden');
  menuOverlay.classList.remove('hidden');
  hiddenInput.blur();
}

// ============================================================
//  BUTTONS
// ============================================================
document.querySelectorAll('.cfg-row').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    startGame(btn.dataset.diff);
  });
});

resRestart.addEventListener('click', () => {
  startGame(state.difficulty);
});

resMenu.addEventListener('click', () => {
  backToMenu();
});

// ============================================================
//  FOCUS MANAGEMENT (Mobile)
// ============================================================
// Tap anywhere on the play screen -> focus input
document.addEventListener('pointerdown', (e) => {
  if (!state.playing || state.sessionComplete) return;
  if (resultsOverlay.classList.contains('hidden') === false) return;
  if (menuOverlay.classList.contains('hidden') === false) return;
  if (e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  focusInput();
}, { passive: false });

hiddenInput.addEventListener('blur', () => {
  if (!state.playing || state.sessionComplete) return;
  if (!menuOverlay.classList.contains('hidden')) return;
  if (!resultsOverlay.classList.contains('hidden')) return;
  setTimeout(() => {
    if (state.playing && !state.sessionComplete) focusInput();
  }, 10);
});

// prevent page scroll on mobile
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('#resultsOverlay')) return;
  e.preventDefault();
}, { passive: false });

// ============================================================
//  TIMER
// ============================================================
setInterval(() => {
  if (!state.playing || state.sessionComplete) return;
  updateElapsed();
  updateStats();
}, 100);

// ============================================================
//  MENU KEYBOARD
// ============================================================
document.addEventListener('keydown', (e) => {
  if (menuOverlay.classList.contains('hidden')) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    startGame(state.difficulty);
  }
});

})();
</script>
