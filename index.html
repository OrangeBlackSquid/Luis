<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Clone</title>
    <style>
        /* --- CSS (Design & Layout) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a2233; /* Dunkelblau aus dem Bild */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        canvas {
            background-color: #1a2233;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 100%;
            max-height: 100%;
            /* Verhindert ungewolltes Markieren auf Handys */
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
    </style>
</head>
<body>

    <!-- Das Spielfeld -->
    <canvas id="gameCanvas"></canvas>

    <script>
        /* --- JavaScript (Spiel-Logik) --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Feste Größe für das Spielfenster
        canvas.width = 800;
        canvas.height = 500;

        // Spielzustände
        let bird = {
            x: 150,
            y: 250,
            width: 45,
            height: 35,
            velocity: 0,
            gravity: 0.45,
            jump: -7.5,
            rotation: 0
        };

        let pipes = [];
        let score = 0;
        let gameState = 'ready'; // 'ready', 'playing', 'gameover'
        let frame = 0;

        // Einstellungen für die Röhren
        const pipeConfig = {
            width: 70,
            gap: 160,
            speed: 3.5,
            interval: 110 // Alle 110 Frames eine neue Röhre
        };

        // Farben exakt nach Design-Vorlage
        const colors = {
            background: '#1a2233', // Dunkelblau
            bird: '#fcc02a',       // Gelb
            pipe: '#5ecf7a',       // Grün
            text: '#ffffff'        // Weiß
        };

        // Steuerung (Tastatur & Maus/Touch)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleInput();
            }
        });

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        });

        function handleInput() {
            if (gameState === 'ready') {
                gameState = 'playing';
                bird.velocity = bird.jump;
            } else if (gameState === 'playing') {
                bird.velocity = bird.jump;
            } else if (gameState === 'gameover') {
                resetGame();
            }
        }

        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            gameState = 'ready';
            frame = 0;
        }

        // Röhren generieren
        function spawnPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeConfig.gap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeConfig.gap,
                passed: false
            });
        }

        // Kollisionserkennung (AABB)
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameState === 'playing') {
                // Physik für den Vogel
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                // Rotation: Neigt sich nach oben beim Springen, nach unten beim Fallen
                bird.rotation = Math.min(Math.max(bird.velocity * 0.06, -0.5), 1.4);

                // Röhren spawnen
                if (frame % pipeConfig.interval === 0) {
                    spawnPipe();
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let pipe = pipes[i];
                    pipe.x -= pipeConfig.speed;

                    // Kollisionsabfrage
                    const birdRect = { x: bird.x, y: bird.y, width: bird.width, height: bird.height };
                    const topPipeRect = { x: pipe.x, y: 0, width: pipeConfig.width, height: pipe.topHeight };
                    const bottomPipeRect = { x: pipe.x, y: pipe.bottomY, width: pipeConfig.width, height: canvas.height - pipe.bottomY };

                    if (checkCollision(birdRect, topPipeRect) || checkCollision(birdRect, bottomPipeRect)) {
                        gameState = 'gameover';
                    }

                    // Punkte zählen
                    if (!pipe.passed && pipe.x + pipeConfig.width < bird.x) {
                        pipe.passed = true;
                        score++;
                    }

                    // Alte Röhren entfernen
                    if (pipe.x + pipeConfig.width < 0) {
                        pipes.splice(i, 1);
                    }
                }

                // Kollision mit Boden und Decke
                if (bird.y + bird.height > canvas.height) {
                    bird.y = canvas.height - bird.height;
                    gameState = 'gameover';
                }
                if (bird.y < 0) {
                    bird.y = 0;
                    bird.velocity = 0;
                }

                frame++;
            }
        }

        // Alles zeichnen (Rendering)
        function draw() {
            // Hintergrund
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Röhren zeichnen (mit abgerundeten Ecken)
            ctx.fillStyle = colors.pipe;
            pipes.forEach(pipe => {
                // Obere Röhre
                ctx.beginPath();
                ctx.roundRect(pipe.x, 0, pipeConfig.width, pipe.topHeight, 12);
                ctx.fill();

                // Untere Röhre
                ctx.beginPath();
                ctx.roundRect(pipe.x, pipe.bottomY, pipeConfig.width, canvas.height - pipe.bottomY, 12);
                ctx.fill();
            });

            // Vogel zeichnen (mit abgerundeten Ecken und Rotation)
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation);
            ctx.fillStyle = colors.bird;
            ctx.beginPath();
            ctx.roundRect(-bird.width / 2, -bird.height / 2, bird.width, bird.height, 8);
            ctx.fill();
            ctx.restore();

            // Punktestand zeichnen (Weiß, oben in der Mitte)
            ctx.fillStyle = colors.text;
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(score, canvas.width / 2, 40);

            // Game Over Bildschirm
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = colors.text;
                ctx.font = 'bold 45px Arial';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 50);
                
                ctx.font = '22px Arial';
                ctx.fillText('Klicken oder Leertaste zum Neustart', canvas.width / 2, canvas.height / 2 + 20);
            }
            
            // Startbildschirm
            if (gameState === 'ready') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = colors.text;
                ctx.font = 'bold 28px Arial';
                ctx.fillText('Klicken oder Leertaste zum Starten', canvas.width / 2, canvas.height / 2);
            }
        }

        // Die Hauptschleife des Spiels
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Spiel starten
        gameLoop();
    </script>
</body>
</html>
