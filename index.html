<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physik Sandbox Deluxe</title>
    <style>
        /* --- CSS (Design & Layout) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a2233;
            touch-action: none; /* Verhindert Scrollen/Zoomen auf dem Handy */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111827;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #111827;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* UI Panel - Mobile Optimiert */
        #ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 34, 51, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        @media (min-width: 768px) {
            #ui-panel {
                top: 20px;
                left: 20px;
                bottom: auto;
                width: 320px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
        }

        h2 {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }

        button.active {
            background: #5ecf7a;
            color: #111827;
            border-color: #5ecf7a;
        }

        /* Farben für die aktiven Buttons passend zum Material */
        button#btn-wood.active { background: #8B4513; color: white; border-color: #8B4513; }
        button#btn-stone.active { background: #6b7280; color: white; border-color: #6b7280; }
        button#btn-metal.active { background: #00bcd4; color: #111827; border-color: #00bcd4; }
        button#btn-ball.active { background: #fcc02a; color: #111827; border-color: #fcc02a; }
        button#btn-bomb.active { background: #ef4444; color: white; border-color: #ef4444; }
        button#btn-eraser.active { background: #ff7f50; color: white; border-color: #ff7f50; }

        .sliders {
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 10px;
            color: #9ca3af;
            flex: 1;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #5ecf7a;
            cursor: pointer;
            height: 20px;
        }

        #clear-btn {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
            margin-top: 4px;
            grid-column: span 4;
        }

        #clear-btn:hover, #clear-btn:active {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="sandboxCanvas"></canvas>

        <div id="ui-panel">
            <div>
                <h2>Materialien</h2>
                <div class="tool-grid">
                    <button id="btn-wood" class="active">Holz</button>
                    <button id="btn-stone">Stein</button>
                    <button id="btn-metal">Metall</button>
                    <button id="btn-ball">Ball</button>
                    <button id="btn-bomb">Bombe</button>
                    <button id="btn-eraser">Radierer</button>
                    <button id="clear-btn">Alles löschen</button>
                </div>
            </div>

            <div>
                <h2>Physik</h2>
                <div class="sliders">
                    <div class="slider-container">
                        <label>Schwerkraft: <span id="gravity-val">0.5</span></label>
                        <input type="range" id="gravity-slider" min="0" max="2" step="0.1" value="0.5">
                    </div>
                    <div class="slider-container">
                        <label>Elastizität: <span id="bounce-val">0.3</span></label>
                        <input type="range" id="bounce-slider" min="0" max="1" step="0.1" value="0.3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- JavaScript (Physik-Engine & Sandbox Logik) --- */
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');
        const GROUND_HEIGHT = 40; // Höhe des sichtbaren Bodens

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 0);

        let entities = [];
        let particles = [];
        let shockwaves = [];
        let gravity = 0.5;
        let globalBounce = 0.3;
        let currentTool = 'wood';
        
        // Für die flüssige Wisch-Steuerung
        let isDrawing = false;
        let lastSpawnX = 0;
        let lastSpawnY = 0;
        const BRUSH_SPACING = 15; // Abstand zwischen den Objekten beim Wischen (kleiner = flüssiger)

        const buttons = {
            wood: document.getElementById('btn-wood'),
            stone: document.getElementById('btn-stone'),
            metal: document.getElementById('btn-metal'),
            ball: document.getElementById('btn-ball'),
            bomb: document.getElementById('btn-bomb'),
            eraser: document.getElementById('btn-eraser')
        };
        const gravitySlider = document.getElementById('gravity-slider');
        const bounceSlider = document.getElementById('bounce-slider');
        const clearBtn = document.getElementById('clear-btn');

        Object.keys(buttons).forEach(key => {
            buttons[key].addEventListener('click', () => {
                Object.values(buttons).forEach(b => b.classList.remove('active'));
                buttons[key].classList.add('active');
                currentTool = key;
            });
        });

        gravitySlider.addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('gravity-val').innerText = gravity.toFixed(1);
        });

        bounceSlider.addEventListener('input', (e) => {
            globalBounce = parseFloat(e.target.value);
            document.getElementById('bounce-val').innerText = globalBounce.toFixed(1);
        });

        clearBtn.addEventListener('click', () => {
            entities = [];
            particles = [];
            shockwaves = [];
        });

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        // --- POINTER EVENTS (Maus & Touch) ---
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            isDrawing = true;
            const pos = getPointerPos(e);
            
            if (currentTool === 'eraser') {
                eraseAt(pos.x, pos.y);
            } else {
                spawnEntity(pos.x, pos.y);
                lastSpawnX = pos.x;
                lastSpawnY = pos.y;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            
            const pos = getPointerPos(e);
            
            if (currentTool === 'eraser') {
                eraseAt(pos.x, pos.y);
            } else {
                // SMOOTHE PLATZIERUNG: Interpolation zwischen letzter und aktueller Position
                const dx = pos.x - lastSpawnX;
                const dy = pos.y - lastSpawnY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 0) {
                    const steps = Math.floor(dist / BRUSH_SPACING);
                    for (let i = 1; i <= steps; i++) {
                        const t = i / steps;
                        const ix = lastSpawnX + dx * t;
                        const iy = lastSpawnY + dy * t;
                        spawnEntity(ix, iy);
                    }
                    
                    // Position aktualisieren, damit die nächste Bewegung nahtlos anschließt
                    if (steps > 0) {
                        lastSpawnX = pos.x;
                        lastSpawnY = pos.y;
                    }
                }
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            e.preventDefault();
            isDrawing = false;
        });
        
        canvas.addEventListener('pointercancel', (e) => {
            e.preventDefault();
            isDrawing = false;
        });

        // --- ENTITY KLASSE (Materialien) ---
        class Entity {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.isDead = false;

                // Standardwerte
                this.w = 40;
                this.h = 40;
                this.mass = 1;
                this.restitution = globalBounce;
                this.destroyable = true; // Kann von Bomben zerstört werden?

                // Material-spezifische Eigenschaften
                switch(type) {
                    case 'wood':
                        this.color = '#8B4513';
                        this.mass = 1;
                        this.restitution = Math.min(globalBounce, 0.4);
                        this.destroyable = true;
                        break;
                    case 'stone':
                        this.color = '#6b7280';
                        this.mass = 3;
                        this.restitution = Math.min(globalBounce, 0.2);
                        this.destroyable = true;
                        break;
                    case 'metal':
                        this.color = '#00bcd4';
                        this.mass = 5;
                        this.restitution = Math.max(globalBounce, 0.5);
                        this.destroyable = false; // Metall ist unzerstörbar
                        break;
                    case 'ball':
                        this.w = 30; this.h = 30;
                        this.color = '#fcc02a';
                        this.mass = 0.5;
                        this.restitution = 0.85; // Bälle springen immer
                        this.destroyable = true;
                        break;
                    case 'bomb':
                        this.w = 30; this.h = 30;
                        this.color = '#ef4444';
                        this.mass = 1.5;
                        this.restitution = 0.1;
                        this.destroyable = true;
                        break;
                }
            }

            update() {
                if (this.isDead) return;
                
                this.vy += gravity;
                this.x += this.vx;
                this.y += this.vy;

                this.vx *= 0.99; // Luftwiderstand
                this.vy *= 0.99;

                // Kollision mit Wänden und BODEN (Hitbox hinzugefügt)
                if (this.x < 0) { this.x = 0; this.vx *= -this.restitution; }
                if (this.x + this.w > canvas.width) { this.x = canvas.width - this.w; this.vx *= -this.restitution; }
                if (this.y < 0) { this.y = 0; this.vy *= -this.restitution; }
                
                // Boden-Kollision (canvas.height - GROUND_HEIGHT)
                if (this.y + this.h > canvas.height - GROUND_HEIGHT) { 
                    this.y = canvas.height - GROUND_HEIGHT - this.h; 
                    this.vy *= -this.restitution;
                    this.vx *= 0.9; // Bodenreibung
                }
            }

            draw() {
                if (this.isDead) return;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                
                if (this.type === 'ball') {
                    ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x + this.w/3, this.y + this.h/3, this.w/6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.roundRect(this.x, this.y, this.w, this.h, 6);
                    ctx.fill();
                    
                    if (this.type === 'bomb') {
                        ctx.fillStyle = '#fcc02a';
                        ctx.fillRect(this.x + this.w/2 - 2, this.y - 8, 4, 8);
                        ctx.beginPath();
                        ctx.arc(this.x + this.w/2, this.y - 8, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            explode() {
                if (this.type !== 'bomb' || this.isDead) return;
                this.isDead = true;
                
                const bx = this.x + this.w/2;
                const by = this.y + this.h/2;
                const blastRadius = 160; // Zerstörungsradius

                // Schockwelle erzeugen
                shockwaves.push(new Shockwave(bx, by, blastRadius));

                // Partikel
                for (let i = 0; i < 40; i++) {
                    particles.push(new Particle(bx, by));
                }

                // Zerstörung und Kraft anwenden
                entities.forEach(e => {
                    if (e === this || e.isDead) return;
                    const ex = e.x + e.w/2;
                    const ey = e.y + e.h/2;
                    const dx = ex - bx;
                    const dy = ey - by;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < blastRadius && dist > 0) {
                        // Kraft anwenden
                        const power = 20 * (1 - dist/blastRadius);
                        e.vx += (dx / dist) * power;
                        e.vy += (dy / dist) * power;

                        // ZERSTÖRUNG: Wenn das Material zerstörbar ist und nahe genug dran
                        if (e.destroyable && dist < blastRadius * 0.8) {
                            e.isDead = true;
                            // Kleine Partikel für die Zerstörung
                            for(let k=0; k<5; k++) particles.push(new Particle(ex, ey));
                        }
                    }
                });
            }
        }

        // --- SHOCKWAVE KLASSE (Visueller Explosionseffekt) ---
        class Shockwave {
            constructor(x, y, maxRadius) {
                this.x = x; this.y = y;
                this.radius = 0;
                this.maxRadius = maxRadius;
                this.life = 1.0;
            }
            update() {
                this.radius += 12;
                this.life -= 0.05;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 80, 80, ${this.life})`;
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // Innerer Ring
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 200, 80, ${this.life * 0.5})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // --- PARTIKEL KLASSE ---
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 20;
                this.vy = (Math.random() - 0.5) * 20;
                this.life = 1.0;
                this.color = Math.random() > 0.5 ? '#ef4444' : (Math.random() > 0.5 ? '#fcc02a' : '#ffffff');
                this.size = Math.random() * 5 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life -= 0.025;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- LOGIK ---
        function spawnEntity(x, y) {
            // Verhindern, dass Objekte im Boden spawnen
            if (y > canvas.height - GROUND_HEIGHT - 20) return;
            
            // Performance-Limit
            if (entities.length > 300) {
                entities.shift(); 
            }
            
            // Zentrierung des Objekts auf den Cursor
            const size = currentTool === 'ball' || currentTool === 'bomb' ? 30 : 40;
            const newEntity = new Entity(x - size/2, y - size/2, currentTool);
            entities.push(newEntity);
        }

        function eraseAt(x, y) {
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (x >= e.x && x <= e.x + e.w && y >= e.y && y <= e.y + e.h) {
                    entities.splice(i, 1);
                    return; 
                }
            }
        }

        function resolveCollisions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    let a = entities[i];
                    let b = entities[j];
                    if (a.isDead || b.isDead) continue;

                    if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
                        let overlapX = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
                        let overlapY = Math.min(a.y + a.h - b.y, b.y + b.h - a.y);

                        // Bomben zünden bei starkem Aufprall
                        if (a.type === 'bomb' && Math.abs(a.vy) > 2.5) a.explode();
                        if (b.type === 'bomb' && Math.abs(b.vy) > 2.5) b.explode();

                        if (overlapX < overlapY) {
                            if (a.x < b.x) { a.x -= overlapX / 2; b.x += overlapX / 2; }
                            else { a.x += overlapX / 2; b.x -= overlapX / 2; }
                            
                            let temp = a.vx; 
                            a.vx = b.vx * b.restitution; 
                            b.vx = temp * a.restitution;
                        } else {
                            if (a.y < b.y) { a.y -= overlapY / 2; b.y += overlapY / 2; }
                            else { a.y += overlapY / 2; b.y -= overlapY / 2; }
                            
                            let temp = a.vy; 
                            a.vy = b.vy * b.restitution; 
                            b.vy = temp * a.restitution;
                            
                            a.vx *= 0.95; b.vx *= 0.95;
                        }
                    }
                }
            }
        }

        // --- HAUPT LOOP ---
        function gameLoop() {
            entities.forEach(e => {
                e.update();
                // Bombe explodiert beim Aufprall auf den Boden
                if (e.type === 'bomb' && e.y + e.h >= canvas.height - GROUND_HEIGHT && Math.abs(e.vy) > 2.5) {
                    e.explode();
                }
            });
            
            resolveCollisions();

            particles.forEach(p => p.update());
            shockwaves.forEach(s => s.update());
            
            entities = entities.filter(e => !e.isDead);
            particles = particles.filter(p => p.life > 0);
            shockwaves = shockwaves.filter(s => s.life > 0);

            // Zeichnen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Boden zeichnen (Sichtbare Hitbox)
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
            // Boden-Linie
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - GROUND_HEIGHT);
            ctx.lineTo(canvas.width, canvas.height - GROUND_HEIGHT);
            ctx.stroke();

            entities.forEach(e => e.draw());
            shockwaves.forEach(s => s.draw());
            particles.forEach(p => p.draw());

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
