<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typing Challenge</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0e1a; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    touch-action:manipulation;
  }

  #app {
    position:relative; width:100vw; height:100vh; overflow:hidden;
    background:radial-gradient(ellipse at center,#141e33 0%,#0a0e1a 100%);
  }

  .screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    padding:24px;
    transition:opacity .25s;
  }
  .screen.hidden { display:none; }

  /* ============ MENU ============ */
  #menu {
    justify-content:center; align-items:center; gap:20px;
    text-align:center;
  }
  #menu h1 {
    font-size:42px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(135deg,#5ecf7a,#00e5ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:4px;
  }
  #menu .subtitle {
    color:#6b7a94; font-size:13px; letter-spacing:3px;
    text-transform:uppercase; margin-bottom:24px;
  }
  .difficulty-grid {
    display:flex; flex-direction:column; gap:12px;
    width:100%; max-width:380px;
  }
  .diff-btn {
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:16px 20px;
    color:#fff; cursor:pointer;
    text-align:left;
    transition:all .18s;
    display:flex; justify-content:space-between; align-items:center;
    font-family:inherit;
  }
  .diff-btn:hover, .diff-btn:active {
    background:rgba(94,207,122,.12);
    border-color:#5ecf7a;
    transform:translateY(-2px);
  }
  .diff-name { font-size:17px; font-weight:800; letter-spacing:2px; }
  .diff-desc { font-size:11px; color:#6b7a94; margin-top:3px; }
  .diff-badge {
    font-size:20px; opacity:.85;
  }

  /* ============ PLAY ============ */
  #play { padding:0; }

  #play header {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px 8px;
    gap:12px;
  }
  #quitBtn {
    background:rgba(255,255,255,.08);
    border:none; color:#fff;
    width:36px; height:36px; border-radius:50%;
    font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:inherit;
  }
  #quitBtn:hover { background:rgba(255,255,255,.15); }
  .stats {
    display:flex; gap:22px; align-items:center;
  }
  .stat {
    text-align:center;
  }
  .stat .val {
    font-size:18px; font-weight:800; color:#fff;
    display:block;
    font-variant-numeric:tabular-nums;
  }
  .stat .label {
    font-size:9px; color:#6b7a94; letter-spacing:1.5px;
    text-transform:uppercase;
  }

  #play main {
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:20px;
  }

  #wordDisplay {
    font-size:clamp(28px,9vw,64px);
    font-weight:800;
    letter-spacing:2px;
    line-height:1.15;
    text-align:center;
    word-break:break-word;
    max-width:100%;
    padding:20px 10px;
    transition:transform .15s;
    font-variant-numeric:tabular-nums;
  }
  #wordDisplay.shake {
    animation:shake .35s ease-in-out;
  }
  #wordDisplay.complete {
    animation:completePop .4s ease-out;
  }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    20%,60% { transform:translateX(-10px); }
    40%,80% { transform:translateX(10px); }
  }
  @keyframes completePop {
    0%   { transform:scale(1); color:#5ecf7a; }
    40%  { transform:scale(1.12); color:#5ecf7a; text-shadow:0 0 40px rgba(94,207,122,.8); }
    100% { transform:scale(1); }
  }

  #wordDisplay .char {
    color:#3d4a63;
    transition:color .1s;
  }
  #wordDisplay .char.correct {
    color:#5ecf7a;
  }
  #wordDisplay .char.wrong {
    color:#ff4a5e;
    text-decoration:underline;
    text-decoration-color:rgba(255,74,94,.6);
  }
  #wordDisplay .char.current {
    position:relative;
  }
  #wordDisplay .char.current::after {
    content:'';
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:4px; background:#5ecf7a;
    border-radius:2px;
    animation:cursorPulse 1s ease-in-out infinite;
  }
  @keyframes cursorPulse {
    0%,100% { opacity:1; }
    50% { opacity:.3; }
  }

  #play footer {
    padding:0 20px 24px;
  }
  .progress-bar {
    width:100%; height:4px;
    background:rgba(255,255,255,.08);
    border-radius:2px;
    overflow:hidden;
  }
  #progressFill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#5ecf7a,#00e5ff);
    border-radius:2px;
    transition:width .3s ease;
  }

  /* Hidden input for mobile keyboard */
  #hiddenInput {
    position:fixed;
    top:50%; left:50%;
    width:1px; height:1px;
    opacity:0.01;
    border:none; outline:none;
    background:transparent;
    color:transparent;
    caret-color:transparent;
    font-size:16px;
    pointer-events:none;
    z-index:-1;
  }

  /* ============ RESULTS ============ */
  #results {
    justify-content:center; align-items:center; gap:16px;
    text-align:center;
    background:radial-gradient(ellipse at center,rgba(94,207,122,.08) 0%,#0a0e1a 100%);
  }
  #results h1 {
    font-size:36px; font-weight:900; letter-spacing:5px;
    color:#5ecf7a;
    text-shadow:0 0 30px rgba(94,207,122,.5);
    margin-bottom:8px;
  }
  .result-stats {
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    width:100%; max-width:340px;
    margin-bottom:16px;
  }
  .result-stats > div {
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    padding:16px 12px;
    border-radius:12px;
    text-align:center;
  }
  .result-stats label {
    display:block; font-size:10px; color:#6b7a94;
    letter-spacing:1.5px; text-transform:uppercase;
    margin-bottom:6px;
  }
  .result-stats span {
    font-size:22px; font-weight:800; color:#fff;
  }
  #menuBtn {
    background:rgba(94,207,122,.15);
    border:1px solid #5ecf7a;
    color:#5ecf7a;
    padding:14px 32px;
    border-radius:10px;
    font-size:14px; font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    font-family:inherit;
    margin-top:12px;
  }
  #menuBtn:hover { background:rgba(94,207,122,.25); }
</style>
</head>

</div>

// ============================================================
//  STATE
// ============================================================
const SESSION_LENGTH = 25;

const state = {
  screen: 'menu',
  difficulty: 'einfach',
  wordPool: [],
  currentIndex: 0,
  currentWord: '',
  input: '',
  lastInputLength: 0,
  wordsCompleted: 0,
  totalErrors: 0,
  totalCharsTyped: 0,
  streak: 0,
  bestStreak: 0,
  startTime: null,
  sessionComplete: false,
};

// ============================================================
//  DOM
// ============================================================
const menuEl = document.getElementById('menu');
const playEl = document.getElementById('play');
const resultsEl = document.getElementById('results');
const wordDisplayEl = document.getElementById('wordDisplay');
const hiddenInput = document.getElementById('hiddenInput');
const quitBtn = document.getElementById('quitBtn');
const menuBtn = document.getElementById('menuBtn');
const progressFill = document.getElementById('progressFill');
const wordProgressEl = document.getElementById('wordProgress');
const accuracyValEl = document.getElementById('accuracyVal');
const streakValEl = document.getElementById('streakVal');
const resultWords = document.getElementById('resultWords');
const resultAccuracy = document.getElementById('resultAccuracy');
const resultStreak = document.getElementById('resultStreak');
const resultTime = document.getElementById('resultTime');

// ============================================================
//  HELPERS
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function show(screen) {
  state.screen = screen;
  menuEl.classList.toggle('hidden', screen !== 'menu');
  playEl.classList.toggle('hidden', screen !== 'play');
  resultsEl.classList.toggle('hidden', screen !== 'results');
}

// ============================================================
//  GAME LOGIC
// ============================================================
function startGame(difficulty) {
  state.difficulty = difficulty;
  state.wordPool = shuffle(WORDS[difficulty]);
  state.currentIndex = 0;
  state.currentWord = state.wordPool[0];
  state.input = '';
  state.lastInputLength = 0;
  state.wordsCompleted = 0;
  state.totalErrors = 0;
  state.totalCharsTyped = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.startTime = Date.now();
  state.sessionComplete = false;

  hiddenInput.value = '';
  updateHUD();
  renderWord();
  show('play');

  // Fokus setzen (mobile keyboard öffnen)
  setTimeout(() => hiddenInput.focus(), 50);
}

function renderWord() {
  const target = state.currentWord;
  const input = state.input;
  let html = '';
  for (let i = 0; i < target.length; i++) {
    let cls = 'char';
    if (i < input.length) {
      if (input[i].toLowerCase() === target[i].toLowerCase()) {
        cls += ' correct';
      } else {
        cls += ' wrong';
      }
    } else if (i === input.length) {
      cls += ' current';
    }
    const ch = target[i] === ' ' ? '&nbsp;' : escapeHtml(target[i]);
    html += `<span class="${cls}">${ch}</span>`;
  }
  wordDisplayEl.innerHTML = html;
}

function escapeHtml(c) {
  if (c === '&') return '&amp;';
  if (c === '<') return '&lt;';
  if (c === '>') return '&gt;';
  return c;
}

function updateHUD() {
  wordProgressEl.textContent = Math.min(state.wordsCompleted + 1, SESSION_LENGTH) + '/' + SESSION_LENGTH;
  const totalTyped = state.totalCharsTyped + state.totalErrors;
  const acc = totalTyped === 0 ? 100 : Math.max(0, Math.round((state.totalCharsTyped / totalTyped) * 100));
  accuracyValEl.textContent = acc + '%';
  streakValEl.textContent = state.streak;
  const pct = (state.wordsCompleted / SESSION_LENGTH) * 100;
  progressFill.style.width = pct + '%';
}

function onWordComplete() {
  // Absolutes Wort abgeschlossen
  state.wordsCompleted++;
  state.streak++;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.totalCharsTyped += state.currentWord.length;

  // Animation
  wordDisplayEl.classList.add('complete');

  // Nächstes Wort
  state.currentIndex++;
  if (state.currentIndex >= state.wordPool.length) {
    // Pool neu mischen
    state.wordPool = shuffle(WORDS[state.difficulty]);
    state.currentIndex = 0;
  }

  if (state.wordsCompleted >= SESSION_LENGTH) {
    state.sessionComplete = true;
    setTimeout(endGame, 350);
    return;
  }

  state.currentWord = state.wordPool[state.currentIndex];
  state.input = '';
  state.lastInputLength = 0;
  hiddenInput.value = '';

  setTimeout(() => {
    wordDisplayEl.classList.remove('complete');
    renderWord();
    updateHUD();
  }, 220);
}

function endGame() {
  const elapsed = (Date.now() - state.startTime) / 1000;
  const totalTyped = state.totalCharsTyped + state.totalErrors;
  const acc = totalTyped === 0 ? 100 : Math.max(0, Math.round((state.totalCharsTyped / totalTyped) * 100));

  resultWords.textContent = state.wordsCompleted;
  resultAccuracy.textContent = acc + '%';
  resultStreak.textContent = state.bestStreak;
  resultTime.textContent = elapsed.toFixed(1) + 's';

  show('results');
}

// ============================================================
//  INPUT HANDLING
// ============================================================
hiddenInput.addEventListener('input', (e) => {
  if (state.sessionComplete) return;

  const val = e.target.value;
  const target = state.currentWord;

  // Komplett richtig?
  if (val.toLowerCase() === target.toLowerCase()) {
    state.input = val;
    renderWord();
    onWordComplete();
    return;
  }

  // Neue Zeichen zählen (nur bei Zunahme der Länge)
  if (val.length > state.lastInputLength) {
    let newErrors = 0;
    for (let i = state.lastInputLength; i < val.length; i++) {
      if (i < target.length && val[i].toLowerCase() !== target[i].toLowerCase()) {
        newErrors++;
      } else if (i >= target.length) {
        newErrors++;
      }
    }
    if (newErrors > 0) {
      state.totalErrors += newErrors;
      state.streak = 0;
      wordDisplayEl.classList.add('shake');
      setTimeout(() => wordDisplayEl.classList.remove('shake'), 360);
    }
  }

  state.lastInputLength = val.length;
  state.input = val;
  renderWord();
  updateHUD();
});

// Verhindere Cursor-Bewegungen, die das input-Feld verwirren
hiddenInput.addEventListener('keydown', (e) => {
  // Erlaube nur Backspace und normales Tippen
  if (e.key === 'Enter') {
    e.preventDefault();
  }
});

// Tippen irgendwo auf den Play-Screen fokussiert das Input-Feld
playEl.addEventListener('pointerdown', (e) => {
  if (state.screen === 'play' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    hiddenInput.focus();
  }
});

// ============================================================
//  EVENT LISTENERS
// ============================================================
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    startGame(btn.dataset.diff);
  });
});

quitBtn.addEventListener('click', () => {
  show('menu');
  hiddenInput.blur();
});

menuBtn.addEventListener('click', () => {
  show('menu');
});

// Verhindere, dass das Input-Feld jemals den Fokus verliert während des Spiels
hiddenInput.addEventListener('blur', () => {
  if (state.screen === 'play' && !state.sessionComplete) {
    setTimeout(() => hiddenInput.focus(), 10);
  }
});

})();
</script>
</body>
</html>
