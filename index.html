<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physik Sandbox</title>
    <style>
        /* --- CSS (Design & Layout) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #1a2233; /* Dunkelblau */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }

        #game-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            max-width: 1200px;
            max-height: 800px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            background-color: #111827;
        }

        /* Gitter-Hintergrund für den Sandbox-Look */
        canvas {
            display: block;
            background-color: #111827;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: crosshair;
        }

        /* UI Panel (Glassmorphism) */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(26, 34, 51, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #5ecf7a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button.active {
            background: #5ecf7a;
            color: #111827;
            border-color: #5ecf7a;
        }

        button#btn-bomb.active { background: #ef4444; border-color: #ef4444; color: white; }
        button#btn-heavy.active { background: #9ca3af; border-color: #9ca3af; color: #111827; }
        button#btn-ball.active { background: #fcc02a; border-color: #fcc02a; color: #111827; }
        button#btn-eraser.active { background: #ff7f50; border-color: #ff7f50; color: white; }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: #9ca3af;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #5ecf7a;
            cursor: pointer;
        }

        #clear-btn {
            background: #ef4444;
            border-color: #ef4444;
            margin-top: 10px;
        }

        #clear-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="sandboxCanvas"></canvas>

        <div id="ui-panel">
            <h2>Werkzeuge</h2>
            <div class="tool-grid">
                <button id="btn-block" class="active">Block</button>
                <button id="btn-ball">Ball</button>
                <button id="btn-heavy">Schwer</button>
                <button id="btn-bomb">Bombe</button>
                <button id="btn-eraser" style="grid-column: span 2;">Radiergummi</button>
            </div>

            <h2>Physik</h2>
            <div class="slider-container">
                <label>Schwerkraft: <span id="gravity-val">0.5</span></label>
                <input type="range" id="gravity-slider" min="0" max="2" step="0.1" value="0.5">
            </div>
            <div class="slider-container">
                <label>Elastizität (Bounce): <span id="bounce-val">0.3</span></label>
                <input type="range" id="bounce-slider" min="0" max="1" step="0.1" value="0.3">
            </div>

            <button id="clear-btn">Alles löschen</button>
        </div>
    </div>

    <script>
        /* --- JavaScript (Physik-Engine & Sandbox Logik) --- */
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas Größe an Container anpassen
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Globale Variablen
        let entities = [];
        let particles = [];
        let gravity = 0.5;
        let globalBounce = 0.3;
        let currentTool = 'block';
        let mouseX = 0;
        let mouseY = 0;
        let isMouseDown = false;

        // UI Elemente
        const buttons = {
            block: document.getElementById('btn-block'),
            ball: document.getElementById('btn-ball'),
            heavy: document.getElementById('btn-heavy'),
            bomb: document.getElementById('btn-bomb'),
            eraser: document.getElementById('btn-eraser')
        };
        const gravitySlider = document.getElementById('gravity-slider');
        const bounceSlider = document.getElementById('bounce-slider');
        const clearBtn = document.getElementById('clear-btn');

        // UI Event Listeners
        Object.keys(buttons).forEach(key => {
            buttons[key].addEventListener('click', () => {
                Object.values(buttons).forEach(b => b.classList.remove('active'));
                buttons[key].classList.add('active');
                currentTool = key;
            });
        });

        gravitySlider.addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('gravity-val').innerText = gravity.toFixed(1);
        });

        bounceSlider.addEventListener('input', (e) => {
            globalBounce = parseFloat(e.target.value);
            document.getElementById('bounce-val').innerText = globalBounce.toFixed(1);
        });

        clearBtn.addEventListener('click', () => {
            entities = [];
            particles = [];
        });

        // Maus Interaktionen
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            if (currentTool === 'eraser') {
                eraseAt(clickX, clickY);
            } else {
                spawnEntity(clickX, clickY);
            }
        });

        canvas.addEventListener('mouseup', () => isMouseDown = false);
        canvas.addEventListener('mouseleave', () => isMouseDown = false);

        // --- ENTITY KLASSE ---
        class Entity {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.isDead = false;

                // Standardwerte
                this.w = 50;
                this.h = 50;
                this.mass = 1;
                this.color = '#5ecf7a';
                this.restitution = globalBounce;

                // Typ-spezifische Anpassungen
                if (type === 'ball') {
                    this.w = 35; this.h = 35;
                    this.color = '#fcc02a';
                    this.restitution = Math.max(globalBounce, 0.7); // Bälle springen immer gut
                    this.mass = 0.8;
                } else if (type === 'heavy') {
                    this.w = 60; this.h = 60;
                    this.color = '#9ca3af';
                    this.restitution = Math.min(globalBounce, 0.2); // Schwere Blöcke springen kaum
                    this.mass = 5;
                } else if (type === 'bomb') {
                    this.w = 30; this.h = 30;
                    this.color = '#ef4444';
                    this.restitution = 0.1;
                    this.mass = 1.5;
                }
            }

            update() {
                if (this.isDead) return;
                
                // Schwerkraft anwenden
                this.vy += gravity;

                // Position aktualisieren
                this.x += this.vx;
                this.y += this.vy;

                // Luftwiderstand / Reibung
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Kollision mit Wänden
                if (this.x < 0) { this.x = 0; this.vx *= -this.restitution; }
                if (this.x + this.w > canvas.width) { this.x = canvas.width - this.w; this.vx *= -this.restitution; }
                if (this.y < 0) { this.y = 0; this.vy *= -this.restitution; }
                if (this.y + this.h > canvas.height) { 
                    this.y = canvas.height - this.h; 
                    this.vy *= -this.restitution;
                    this.vx *= 0.9; // Bodenreibung
                }
            }

            draw() {
                if (this.isDead) return;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'ball') {
                    ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI * 2);
                    ctx.fill();
                    // Highlight für den Ball
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x + this.w/3, this.y + this.h/3, this.w/6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.roundRect(this.x, this.y, this.w, this.h, 8);
                    ctx.fill();
                    
                    // Bomben-Zündschnur
                    if (this.type === 'bomb') {
                        ctx.fillStyle = '#fcc02a';
                        ctx.fillRect(this.x + this.w/2 - 2, this.y - 10, 4, 10);
                        ctx.beginPath();
                        ctx.arc(this.x + this.w/2, this.y - 10, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            explode() {
                if (this.type !== 'bomb' || this.isDead) return;
                this.isDead = true;
                
                const bx = this.x + this.w/2;
                const by = this.y + this.h/2;
                const radius = 150;
                const force = 15;

                // Partikel erzeugen
                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(bx, by));
                }

                // Kraft auf andere Objekte anwenden
                entities.forEach(e => {
                    if (e === this || e.isDead) return;
                    const ex = e.x + e.w/2;
                    const ey = e.y + e.h/2;
                    const dx = ex - bx;
                    const dy = ey - by;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < radius && dist > 0) {
                        const power = force * (1 - dist/radius);
                        e.vx += (dx / dist) * power;
                        e.vy += (dy / dist) * power;
                    }
                });
            }
        }

        // --- PARTIKEL KLASSE (für Explosionen) ---
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.life = 1.0;
                this.color = Math.random() > 0.5 ? '#ef4444' : '#fcc02a';
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Partikel-Schwerkraft
                this.life -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- SPIEL LOGIK ---
        function spawnEntity(x, y) {
            // Verhindern, dass Objekte zu nah am Rand spawnen
            x = Math.max(10, Math.min(x, canvas.width - 60));
            y = Math.max(10, Math.min(y, canvas.height - 60));
            
            const newEntity = new Entity(x - 25, y - 25, currentTool);
            entities.push(newEntity);
        }

        function eraseAt(x, y) {
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (x >= e.x && x <= e.x + e.w && y >= e.y && y <= e.y + e.h) {
                    entities.splice(i, 1);
                    return; // Nur ein Objekt pro Klick löschen
                }
            }
        }

        // AABB Kollisionsauflösung (vereinfacht für Sandbox)
        function resolveCollisions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    let a = entities[i];
                    let b = entities[j];
                    if (a.isDead || b.isDead) continue;

                    if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
                        // Kollision erkannt
                        let overlapX = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
                        let overlapY = Math.min(a.y + a.h - b.y, b.y + b.h - a.y);

                        // Bomben zünden bei Aufprall
                        if (a.type === 'bomb' && Math.abs(a.vy) > 2) a.explode();
                        if (b.type === 'bomb' && Math.abs(b.vy) > 2) b.explode();

                        if (overlapX < overlapY) {
                            // X-Achse auflösen
                            if (a.x < b.x) { a.x -= overlapX / 2; b.x += overlapX / 2; }
                            else { a.x += overlapX / 2; b.x -= overlapX / 2; }
                            
                            let temp = a.vx; 
                            a.vx = b.vx * b.restitution; 
                            b.vx = temp * a.restitution;
                        } else {
                            // Y-Achse auflösen
                            if (a.y < b.y) { a.y -= overlapY / 2; b.y += overlapY / 2; }
                            else { a.y += overlapY / 2; b.y -= overlapY / 2; }
                            
                            let temp = a.vy; 
                            a.vy = b.vy * b.restitution; 
                            b.vy = temp * a.restitution;
                            
                            // Reibung auf X-Achse beim Aufprall auf Y
                            a.vx *= 0.95; b.vx *= 0.95;
                        }
                    }
                }
            }
        }

        // --- HAUPT LOOP ---
        function gameLoop() {
            // Update
            if (isMouseDown && currentTool !== 'eraser') {
                // Wenn Maus gedrückt gehalten wird, spawnen wir kontinuierlich (wie ein Pinsel)
                if (Math.random() > 0.8) spawnEntity(mouseX, mouseY);
            }

            entities.forEach(e => {
                e.update();
                if (e.type === 'bomb' && e.y + e.h >= canvas.height && Math.abs(e.vy) > 2) {
                    e.explode();
                }
            });
            
            resolveCollisions();

            particles.forEach(p => p.update());
            
            // Tote Entitäten entfernen
            entities = entities.filter(e => !e.isDead);
            particles = particles.filter(p => p.life > 0);

            // Zeichnen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Maus-Vorschau zeichnen
            if (currentTool !== 'eraser') {
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = currentTool === 'block' ? '#5ecf7a' : 
                               currentTool === 'ball' ? '#fcc02a' : 
                               currentTool === 'heavy' ? '#9ca3af' : '#ef4444';
                ctx.beginPath();
                if (currentTool === 'ball') {
                    ctx.arc(mouseX, mouseY, 17, 0, Math.PI * 2);
                } else {
                    ctx.roundRect(mouseX - 25, mouseY - 25, currentTool === 'heavy' ? 60 : 50, currentTool === 'heavy' ? 60 : 50, 8);
                }
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            entities.forEach(e => e.draw());
            particles.forEach(p => p.draw());

            requestAnimationFrame(gameLoop);
        }

        // Spiel starten
        gameLoop();
    </script>
</body>
</html>
