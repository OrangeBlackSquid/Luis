<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>typing.challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lexend+Deca:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #323437;
    --bg-sub: #2c2e31;
    --bg-sub-alt: #262829;
    --sub: #646669;
    --sub-alt: #4a4d51;
    --text: #d1d0c5;
    --main: #e2b714;
    --error: #ca4754;
    --error-extra: #7e2a33;
    --caret: #e2b714;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', 'Courier New', monospace;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
    position:fixed;
  }
  #app { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; gap:12px; flex-shrink:0;
    position:relative; z-index:5; pointer-events:none;
  }
  .topbar-left { display:flex; align-items:center; gap:10px; }

  .back-btn {
    display:none;
    width:36px; height:36px;
    border-radius:8px;
    background:transparent;
    border:none;
    color:var(--sub);
    cursor:pointer;
    align-items:center; justify-content:center;
    transition:all .15s;
    pointer-events:auto;
    -webkit-appearance:none; appearance:none;
    padding:0;
  }
  .back-btn.visible { display:flex; }
  .back-btn:hover, .back-btn:active {
    background:var(--bg-sub);
    color:var(--text);
  }
  .back-btn svg { width:20px; height:20px; }

  .logo { display:flex; align-items:baseline; gap:2px; font-family:'Lexend Deca', 'JetBrains Mono', sans-serif; }
  .logo .logo-icon { font-size:20px; color:var(--main); margin-right:6px; line-height:1; }
  .logo .logo-main { font-size:20px; font-weight:700; color:var(--text); line-height:1; }
  .logo .logo-dot { font-size:20px; font-weight:700; color:var(--main); line-height:1; }
  .logo .logo-tail { font-size:14px; color:var(--sub); margin-left:4px; line-height:1; }

  .stats { display:flex; align-items:center; gap:20px; font-family:'Lexend Deca', sans-serif; }
  .stat { display:flex; flex-direction:column; line-height:1.1; min-width:46px; }
  .stat .val { font-size:20px; font-weight:400; color:var(--main); font-variant-numeric:tabular-nums; }
  .stat .lbl { font-size:9px; letter-spacing:1.5px; text-transform:lowercase; color:var(--sub); margin-top:2px; }

  main {
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    padding:20px 24px; position:relative; overflow:hidden;
    z-index:2; pointer-events:none;
    min-height:0;
  }

  #wordDisplay {
    width:100%;
    max-width:100%;
    overflow:hidden;
    position:relative;
    padding:20px 0;
    transition:transform .15s;
  }
  #wordDisplay.fade {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
  }
  #wordDisplay.shake {
    animation: displayShake .3s ease-in-out;
  }
  @keyframes displayShake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-6px); }
    40%,80% { transform: translateX(6px); }
  }
  #wordDisplay.complete .letter {
    color: var(--main) !important;
  }

  #wordTrack {
    display:inline-block;
    white-space:nowrap;
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(28px, 9vw, 68px);
    font-weight:500;
    letter-spacing:1px;
    line-height:1.25;
    color:var(--sub);
    will-change:transform;
    position:relative;
  }

  #wordTrack .letter {
    color: var(--sub);
    transition: color .12s;
  }
  #wordTrack .letter.correct { color: var(--text); }
  #wordTrack .letter.wrong {
    color:var(--error);
    text-decoration:underline; text-decoration-color:var(--error);
    text-underline-offset:6px; text-decoration-thickness:3px;
  }
  #wordTrack .letter.extra {
    color: var(--error-extra);
    text-decoration:underline; text-decoration-color:var(--error-extra);
    text-underline-offset:6px; text-decoration-thickness:3px;
  }
  #wordTrack .caret-anchor {
    display:inline-block;
    width:0;
    height:1em;
    vertical-align:baseline;
    pointer-events:none;
  }
  #wordTrack .virtual-spacer {
    display:inline-block;
    height:1em;
    vertical-align:baseline;
  }

  #caret {
    position:fixed;
    top:0; left:0;
    width:3px;
    height:1em;
    background:var(--caret);
    border-radius:1.5px;
    pointer-events:none;
    opacity:0;
    z-index:3;
    transform:translate(0, 0);
    will-change:transform,height,opacity;
  }
  #caret.visible { opacity:1; }

  .progress-wrap { width:100%; max-width:600px; padding:0 10px; margin-top:36px; }
  .progress-bar { width:100%; height:3px; background:var(--bg-sub); border-radius:2px; overflow:hidden; }
  #progressFill { height:100%; width:0%; background:var(--main); border-radius:2px; transition:width .3s ease; }
  .progress-label {
    text-align:center; margin-top:10px; font-size:11px;
    letter-spacing:2px; color:var(--sub-alt);
    font-family:'Lexend Deca', sans-serif; text-transform:lowercase;
  }

  .footer {
    padding:14px 20px 20px; display:flex; justify-content:center;
    gap:20px; font-family:'Lexend Deca', sans-serif;
    font-size:11px; color:var(--sub-alt); letter-spacing:.5px;
    flex-shrink:0; flex-wrap:wrap;
    position:relative; z-index:5; pointer-events:none;
  }
  .footer .hint { display:flex; align-items:center; gap:6px; }
  .footer kbd {
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--bg-sub); color:var(--sub);
    padding:3px 8px; border-radius:4px;
    font-family:inherit; font-size:10px;
    letter-spacing:1px; min-width:22px;
  }

  #menuOverlay {
    position:absolute; inset:0; background:var(--bg);
    z-index:50; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    gap:22px; padding:24px; transition:opacity .2s;
    overflow-y:auto;
  }
  #menuOverlay.hidden { display:none; }
  #menuOverlay .menu-logo {
    font-family:'Lexend Deca', sans-serif;
    font-size:38px; font-weight:700; color:var(--text);
    letter-spacing:1px; display:flex; align-items:baseline;
  }
  #menuOverlay .menu-logo .accent { color:var(--main); }
  #menuOverlay .menu-logo .dot { color:var(--main); }
  #menuOverlay .menu-logo .tail {
    font-size:18px; color:var(--sub);
    font-family:'JetBrains Mono', monospace; margin-left:8px;
  }
  #menuOverlay .menu-subtitle {
    font-family:'Lexend Deca', sans-serif;
    color:var(--sub); font-size:12px;
    letter-spacing:2px; text-transform:lowercase;
    margin-top:-10px;
  }
  .menu-config { display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px; margin-top:8px; }
  .cfg-row {
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-sub); border:1px solid transparent;
    border-radius:8px; padding:16px 18px; cursor:pointer;
    transition:all .15s; color:var(--text);
    font-family:inherit; font-size:16px; text-align:left;
  }
  .cfg-row:hover, .cfg-row:active {
    background:var(--bg-sub-alt); border-color:var(--main);
  }
  .cfg-row .cfg-name {
    font-family:'Lexend Deca', sans-serif;
    font-weight:700; letter-spacing:1px; text-transform:lowercase;
  }
  .cfg-row .cfg-stars { color:var(--main); font-size:14px; letter-spacing:2px; }
  .cfg-row .cfg-stars.long { font-size:11px; letter-spacing:1px; }

  .settings-trigger {
    position:absolute;
    top:0; right:0;
    width:90px; height:90px;
    z-index:55;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .settings-panel {
    position:absolute;
    top:70px; right:16px;
    background:var(--bg-sub);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:10px;
    padding:14px 18px 14px;
    z-index:56;
    min-width:280px;
    max-width:calc(100vw - 32px);
    box-shadow:0 10px 40px rgba(0,0,0,0.55);
    animation:settingsPop .18s ease-out;
  }
  .settings-panel.hidden { display:none; }
  @keyframes settingsPop {
    from { opacity:0; transform:translateY(-6px) scale(.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .settings-title {
    font-family:'Lexend Deca', sans-serif;
    font-size:10px; color:var(--sub);
    letter-spacing:1.8px; text-transform:lowercase;
    margin-bottom:10px;
  }
  .settings-row {
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; cursor:pointer;
    padding:6px 0;
    user-select:none; -webkit-user-select:none;
  }
  .settings-label {
    font-family:'Lexend Deca', sans-serif;
    font-size:14px; color:var(--text);
    text-transform:lowercase; letter-spacing:0.3px;
  }
  .settings-row input[type="checkbox"] {
    position:absolute;
    opacity:0;
    pointer-events:none;
    width:1px; height:1px;
  }
  .settings-checkbox {
    width:22px; height:22px;
    border-radius:5px;
    border:2px solid var(--sub-alt);
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s;
    flex-shrink:0;
  }
  .settings-checkbox svg {
    width:13px; height:13px;
    stroke:var(--bg);
    stroke-width:3.5;
    fill:none;
    opacity:0;
    transition:opacity .15s;
  }
  .settings-row input:checked ~ .settings-checkbox {
    background:var(--main);
    border-color:var(--main);
  }
  .settings-row input:checked ~ .settings-checkbox svg {
    opacity:1;
  }

  .settings-sub {
    margin-left:6px;
    margin-top:4px;
    padding-left:12px;
    border-left:2px solid rgba(226,183,20,0.25);
    display:flex;
    flex-direction:column;
    gap:8px;
    animation:subReveal .2s ease-out;
  }
  .settings-sub.hidden { display:none; }
  @keyframes subReveal {
    from { opacity:0; transform:translateY(-4px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .settings-slider-row {
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:2px 0;
  }
  .settings-slider-label {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Lexend Deca', sans-serif;
    font-size:12px;
    color:var(--sub);
    text-transform:lowercase;
    gap:8px;
  }
  .settings-slider-label > span:first-child {
    flex-shrink:0;
  }
  .slider-value {
    color:var(--main);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    background:transparent;
    border:1px solid transparent;
    border-radius:4px;
    padding:2px 6px;
    width:64px;
    text-align:right;
    outline:none;
    transition:all .15s;
    cursor:text;
    -webkit-appearance:none;
    appearance:none;
    -moz-appearance:textfield;
    user-select:text;
    -webkit-user-select:text;
  }
  .slider-value::-webkit-outer-spin-button,
  .slider-value::-webkit-inner-spin-button {
    -webkit-appearance:none;
    appearance:none;
    margin:0;
  }
  .slider-value:hover {
    border-color:rgba(226,183,20,0.35);
  }
  .slider-value:focus {
    border-color:var(--main);
    background:rgba(226,183,20,0.08);
    cursor:text;
  }

  .settings-slider-row input[type="range"] {
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:20px;
    background:transparent;
    outline:none;
    cursor:pointer;
    margin:0;
    padding:0;
  }
  .settings-slider-row input[type="range"]::-webkit-slider-runnable-track {
    height:4px;
    background:var(--sub-alt);
    border-radius:2px;
  }
  .settings-slider-row input[type="range"]::-moz-range-track {
    height:4px;
    background:var(--sub-alt);
    border-radius:2px;
  }
  .settings-slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none;
    appearance:none;
    width:14px;
    height:14px;
    background:var(--main);
    border-radius:50%;
    cursor:pointer;
    border:none;
    margin-top:-5px;
    transition:transform .12s;
  }
  .settings-slider-row input[type="range"]::-webkit-slider-thumb:active {
    transform:scale(1.2);
  }
  .settings-slider-row input[type="range"]::-moz-range-thumb {
    width:14px;
    height:14px;
    background:var(--main);
    border-radius:50%;
    cursor:pointer;
    border:none;
  }

  #resultsOverlay {
    position:absolute; inset:0; background:var(--bg);
    z-index:60; display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    gap:20px; padding:30px 20px;
  }
  #resultsOverlay.hidden { display:none; }
  .results-title {
    font-family:'Lexend Deca', sans-serif;
    font-size:24px; font-weight:400; color:var(--sub);
    letter-spacing:2px; text-transform:lowercase; margin-bottom:8px;
  }
  .results-grid {
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:30px 44px; margin:16px 0; max-width:500px;
  }
  .results-item { text-align:center; }
  .results-item .label {
    font-family:'Lexend Deca', sans-serif;
    color:var(--sub); font-size:12px;
    letter-spacing:1.5px; text-transform:lowercase; margin-bottom:6px;
  }
  .results-item .value {
    font-family:'JetBrains Mono', monospace;
    color:var(--main); font-size:48px; font-weight:400; line-height:1;
  }
  .results-item .value.small { font-size:28px; }
  .results-buttons { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .results-btn {
    background:transparent; border:1px solid var(--sub-alt);
    color:var(--sub); padding:11px 24px; border-radius:6px;
    font-family:inherit; font-size:13px;
    letter-spacing:1px; cursor:pointer; transition:all .15s;
  }
  .results-btn:hover, .results-btn:active { border-color:var(--main); color:var(--main); }
  .results-btn.primary { background:var(--main); color:var(--bg); border-color:var(--main); }
  .results-btn.primary:hover { background:#f0c930; }

  #hiddenInput {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    opacity:1; background:transparent;
    border:none; outline:none;
    color:transparent; caret-color:transparent; text-shadow:none;
    font-size:16px; padding:0; margin:0;
    z-index:1; -webkit-appearance:none; appearance:none;
    border-radius:0; -webkit-user-select:text; user-select:text;
    resize:none;
  }
  #hiddenInput::selection { background:transparent; color:transparent; }
  #hiddenInput::-moz-selection { background:transparent; color:transparent; }

  @media (max-width: 700px) {
    .topbar { padding:12px 16px; }
    .logo .logo-icon { font-size:18px; }
    .logo .logo-main, .logo .logo-dot { font-size:18px; }
    .logo .logo-tail { font-size:12px; }
    .stat .val { font-size:17px; }
    .stat .lbl { font-size:8px; letter-spacing:1px; }
    .stats { gap:14px; }
    main { padding:14px 16px; }
    #wordDisplay { padding:14px 0; }
    .progress-wrap { margin-top:24px; padding:0; }
    .footer { padding:10px 14px 14px; gap:14px; font-size:10px; }
    #menuOverlay { gap:16px; padding:20px; }
    #menuOverlay .menu-logo { font-size:30px; }
    #menuOverlay .menu-logo .tail { font-size:14px; }
    .cfg-row { padding:13px 16px; font-size:15px; }
    .cfg-row .cfg-stars { font-size:12px; letter-spacing:1.5px; }
    .cfg-row .cfg-stars.long { font-size:9px; letter-spacing:0.5px; }
    .results-grid { gap:22px 32px; }
    .results-item .value { font-size:38px; }
    .results-item .value.small { font-size:22px; }
    .back-btn { width:34px; height:34px; }
    .settings-panel { top:64px; right:12px; min-width:250px; padding:12px 14px 12px; }
    .slider-value { width:56px; padding:2px 4px; }
  }
  @media (max-height: 500px) {
    #wordDisplay { padding:8px 0; }
    .progress-wrap { margin-top:14px; }
    .footer { padding:6px 14px 10px; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-left">
      <button id="backBtn" class="back-btn" aria-label="Zurück zum Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="logo">
        <span class="logo-icon">⌨</span>
        <span class="logo-main">typing</span>
        <span class="logo-dot">.</span>
        <span class="logo-tail">challenge</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="val" id="statWpm">0</span><span class="lbl">wpm</span></div>
      <div class="stat"><span class="val" id="statAcc">100%</span><span class="lbl">acc</span></div>
      <div class="stat"><span class="val" id="statTime">0:00</span><span class="lbl">time</span></div>
    </div>
  </header>

  <main>
    <div id="wordDisplay">
      <div id="wordTrack"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-label"><span id="progressLabel">1 / 25</span></div>
    </div>
  </main>

  <footer class="footer">
    <div class="hint"><kbd>esc</kbd>quit</div>
    <div class="hint"><kbd>tab</kbd>restart</div>
  </footer>

  <div id="caret"></div>

  <div id="menuOverlay">
    <div id="settingsTrigger" class="settings-trigger" aria-label="Einstellungen"></div>
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-title">settings</div>

      <label class="settings-row">
        <span class="settings-label">auto correct</span>
        <input type="checkbox" id="autoCorrectCheckbox">
        <span class="settings-checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
      </label>

      <label class="settings-row">
        <span class="settings-label">auto type</span>
        <input type="checkbox" id="autoTypeCheckbox">
        <span class="settings-checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
      </label>

      <div id="autoTypeOptions" class="settings-sub hidden">
        <div class="settings-slider-row">
          <div class="settings-slider-label">
            <span>wpm</span>
            <input type="number" class="slider-value" id="wpmValue" min="1" max="1000" step="1" value="400" inputmode="numeric" autocomplete="off">
          </div>
          <input type="range" id="wpmSlider" min="1" max="1000" value="400" step="1">
        </div>

        <label class="settings-row">
          <span class="settings-label">vary</span>
          <input type="checkbox" id="varyCheckbox">
          <span class="settings-checkbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
        </label>

        <div id="varyOptions" class="settings-sub hidden">
          <div class="settings-slider-row">
            <div class="settings-slider-label">
              <span>vary strength</span>
              <input type="number" class="slider-value" id="varyValue" min="0" max="1000" step="1" value="10" inputmode="numeric" autocomplete="off">
            </div>
            <input type="range" id="varySlider" min="0" max="1000" value="10" step="1">
          </div>
        </div>
      </div>
    </div>

    <div class="menu-logo">
      <span>typing</span><span class="dot">.</span><span class="accent">challenge</span>
      <span class="tail">/deutsch</span>
    </div>
    <div class="menu-subtitle">wähle eine schwierigkeit</div>
    <div class="menu-config">
      <button class="cfg-row" data-diff="einfach">
        <span class="cfg-name">einfach</span>
        <span class="cfg-stars">★</span>
      </button>
      <button class="cfg-row" data-diff="mittel">
        <span class="cfg-name">mittel</span>
        <span class="cfg-stars">★★</span>
      </button>
      <button class="cfg-row" data-diff="schwer">
        <span class="cfg-name">schwer</span>
        <span class="cfg-stars">★★★</span>
      </button>
      <button class="cfg-row" data-diff="unmöglich">
        <span class="cfg-name">unmöglich</span>
        <span class="cfg-stars">★★★★</span>
      </button>
      <button class="cfg-row" data-diff="sehr_einfach">
        <span class="cfg-name">sehr einfach</span>
        <span class="cfg-stars">★★★★★</span>
      </button>

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildSessionPool(allWords) {
  const groups = new Map();
  for (const w of allWords) {
    const key = w.toLowerCase().slice(0, 6);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  }
  let shuffledGroups = [];
  for (const g of groups.values()) shuffledGroups.push(shuffle(g));
  shuffledGroups = shuffle(shuffledGroups);
  const result = [];
  let round = 0, anyAdded = true;
  while (anyAdded) {
    anyAdded = false;
    for (const g of shuffledGroups) {
      if (round < g.length) { result.push(g[round]); anyAdded = true; }
    }
    round++;
  }
  return result;
}

const varyOptions = document.getElementById('varyOptions');
const varySlider = document.getElementById('varySlider');
const varyValue = document.getElementById('varyValue');

autoCorrectCheckbox.checked = settings.autoCorrect;
autoTypeCheckbox.checked = settings.autoType;
wpmSlider.value = settings.autoTypeWpm;
wpmValue.value = settings.autoTypeWpm;
varyCheckbox.checked = settings.vary;
varySlider.value = settings.varyStrength;
varyValue.value = settings.varyStrength;

if (settings.autoType) autoTypeOptions.classList.remove('hidden');
if (settings.vary) varyOptions.classList.remove('hidden');

let settingsOpen = false;
function openSettings() { settingsOpen = true; settingsPanel.classList.remove('hidden'); }
function closeSettings() { settingsOpen = false; settingsPanel.classList.add('hidden'); }

settingsTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  if (settingsOpen) closeSettings(); else openSettings();
});

document.addEventListener('pointerdown', (e) => {
  if (!settingsOpen) return;
  if (settingsTrigger.contains(e.target)) return;
  if (settingsPanel.contains(e.target)) return;
  closeSettings();
});

autoCorrectCheckbox.addEventListener('change', () => {
  settings.autoCorrect = autoCorrectCheckbox.checked;
  saveSettings();
});

autoTypeCheckbox.addEventListener('change', () => {
  settings.autoType = autoTypeCheckbox.checked;
  if (settings.autoType) autoTypeOptions.classList.remove('hidden');
  else autoTypeOptions.classList.add('hidden');
  saveSettings();
});

wpmSlider.addEventListener('input', () => {
  settings.autoTypeWpm = parseInt(wpmSlider.value, 10);
  wpmValue.value = settings.autoTypeWpm;
  saveSettings();
});

varyCheckbox.addEventListener('change', () => {
  settings.vary = varyCheckbox.checked;
  if (settings.vary) varyOptions.classList.remove('hidden');
  else varyOptions.classList.add('hidden');
  saveSettings();
});

varySlider.addEventListener('input', () => {
  settings.varyStrength = parseInt(varySlider.value, 10);
  varyValue.value = settings.varyStrength;
  saveSettings();
});

function clampInt(raw, min, max, fallback) {
  let v = parseInt(raw, 10);
  if (isNaN(v)) v = fallback;
  if (v < min) v = min;
  if (v > max) v = max;
  return v;
}

function bindEditableValue(inputEl, sliderEl, settingsKey, min, max) {
  inputEl.addEventListener('focus', () => {
    try { inputEl.select(); } catch (e) {}
  });

  inputEl.addEventListener('input', () => {
    const v = parseInt(inputEl.value, 10);
    if (isNaN(v)) return;
    const clamped = Math.max(min, Math.min(max, v));
    sliderEl.value = clamped;
    settings[settingsKey] = clamped;
    saveSettings();
  });

  inputEl.addEventListener('blur', () => {
    const fallback = parseInt(sliderEl.value, 10) || min;
    const v = clampInt(inputEl.value, min, max, fallback);
    inputEl.value = v;
    sliderEl.value = v;
    settings[settingsKey] = v;
    saveSettings();
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      inputEl.blur();
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      inputEl.value = settings[settingsKey];
      inputEl.blur();
    }
  });
}

bindEditableValue(wpmValue, wpmSlider, 'autoTypeWpm', 1, 1000);
bindEditableValue(varyValue, varySlider, 'varyStrength', 0, 1000);

function escapeHtml(c) {
  if (c === '&') return '&amp;';
  if (c === '<') return '&lt;';
  if (c === '>') return '&gt;';
  return c;
}
function formatTime(sec) {
  const s = Math.floor(sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}
function openKeyboard() {
  try {
    hiddenInput.focus();
    const len = hiddenInput.value.length;
    if (hiddenInput.setSelectionRange) hiddenInput.setSelectionRange(len, len);
  } catch (e) {}
}
function setInputValue(val) {
  hiddenInput.value = val;
  try {
    const len = val.length;
    hiddenInput.setSelectionRange(len, len);
  } catch (e) {}
}

function stopAutoType() {
  if (autoTypeTimer) {
    clearTimeout(autoTypeTimer);
    autoTypeTimer = null;
  }
}

function computeAutoTypeDelay() {
  let wpm = settings.autoTypeWpm;
  if (settings.vary && settings.varyStrength > 0) {
    const offset = (Math.random() * 2 - 1) * settings.varyStrength;
    wpm = wpm + offset;
    if (wpm < 1) wpm = 1;
  }
  if (wpm < 1) wpm = 1;
  return Math.max(1, 12000 / wpm);
}

function scheduleNextAutoTypeChar() {
  stopAutoType();
  if (!settings.autoType) return;
  if (!state.playing || state.sessionComplete) return;
  const delayMs = computeAutoTypeDelay();
  autoTypeTimer = setTimeout(autoTypeStep, delayMs);
}

function autoTypeStep() {
  autoTypeTimer = null;
  if (!settings.autoType) return;
  if (!state.playing || state.sessionComplete) return;

  const target = state.currentWord;
  const current = hiddenInput.value;

  if (!target || current.length >= target.length) {
    scheduleNextAutoTypeChar();
    return;
  }

  const nextChar = target[current.length];
  setInputValue(current + nextChar);
  syncInput();

  if (!state.sessionComplete) {
    scheduleNextAutoTypeChar();
  }
}

function startGame(difficulty) {
  closeSettings();
  stopAutoType();

  state.difficulty = difficulty;
  state.wordPool = buildSessionPool(WORDS[difficulty]);
  state.currentIndex = 0;
  state.currentWord = state.wordPool[0];
  state.lastValue = '';
  state.wordsCompleted = 0;
  state.correctChars = 0;
  state.wrongChars = 0;
  state.startTime = performance.now();
  state.elapsed = 0;
  state.sessionComplete = false;
  state.playing = true;

  hiddenInput.value = '';
  menuOverlay.classList.add('hidden');
  resultsOverlay.classList.add('hidden');
  backBtn.classList.add('visible');

  renderedStart = 0;
  renderedEnd = 0;
  currentTrackOffset = 0;
  trackOffsetReady = false;
  lastMode = null;
  caret.ready = false;
  caret.visible = false;
  caretEl.classList.remove('visible');
  wordTrackEl.style.transform = '';

  renderWord();
  updateStats();
  updateProgress();
  openKeyboard();

  if (settings.autoType) {
    setTimeout(() => {
      if (settings.autoType && state.playing && !state.sessionComplete) {
        scheduleNextAutoTypeChar();
      }
    }, 120);
  }
}

function renderWord() {
  const target = state.currentWord;
  const input = hiddenInput.value;
  const caretPos = input.length;
  const totalLen = Math.max(target.length, input.length);

  let start, end;

  if (totalLen <= VIRTUALIZE_THRESHOLD) {
    start = 0;
    end = totalLen;
  } else {
    const bufStart = renderedStart + WINDOW_BUFFER;
    const bufEnd = renderedEnd - WINDOW_BUFFER;
    if (caretPos >= bufStart && caretPos <= bufEnd && (renderedEnd - renderedStart) > 100) {
      start = renderedStart;
      end = renderedEnd;
    } else {
      start = Math.max(0, caretPos - 200);
      end = Math.min(totalLen, start + WINDOW_SIZE);
      if (end - start < WINDOW_SIZE) {
        start = Math.max(0, end - WINDOW_SIZE);
      }
    }
  }

  renderedStart = start;
  renderedEnd = end;

  let html = '';
  if (start > 0) {
    html += '<span class="virtual-spacer" style="width:' + start + 'ch"></span>';
  }

  for (let i = start; i < end; i++) {
    if (i === caretPos) {
      html += '<span class="caret-anchor"></span>';
    }
    if (i < target.length) {
      let cls = 'letter';
      if (i < input.length) {
        cls += input[i].toLowerCase() === target[i].toLowerCase() ? ' correct' : ' wrong';
      }
      html += '<span class="' + cls + '">' + escapeHtml(target[i]) + '</span>';
    } else if (i < input.length) {
      html += '<span class="letter extra">' + escapeHtml(input[i]) + '</span>';
    }
  }

  if (caretPos >= end) {
    html += '<span class="caret-anchor"></span>';
  }

  wordTrackEl.innerHTML = html;

  const mode = isTreadmillMode() ? 'treadmill' : 'centered';
  if (mode !== lastMode) {
    lastMode = mode;
    trackOffsetReady = false;
    caret.ready = false;
  }

  if (mode === 'treadmill') {
    wordDisplayEl.classList.add('fade');
  } else {
    wordDisplayEl.classList.remove('fade');
  }
}

function isTreadmillMode() {
  const fontSize = parseFloat(getComputedStyle(wordTrackEl).fontSize) || 30;
  const charWidth = fontSize * 0.6;
  const wordWidth = state.currentWord.length * charWidth;
  const viewportWidth = wordDisplayEl.clientWidth;
  return wordWidth > viewportWidth * TREADMILL_WIDTH_RATIO;
}

function updateProgress() {
  const pct = (state.wordsCompleted / SESSION_LENGTH) * 100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = Math.min(state.wordsCompleted + 1, SESSION_LENGTH) + ' / ' + SESSION_LENGTH;
}

function updateStats() {
  const total = state.correctChars + state.wrongChars;
  const acc = total === 0 ? 100 : Math.round((state.correctChars / total) * 100);
  const minutes = state.elapsed / 60;
  const wpm = minutes > 0.01 ? Math.round((state.correctChars / 5) / minutes) : 0;
  statWpm.textContent = wpm;
  statAcc.textContent = acc + '%';
  statTime.textContent = formatTime(state.elapsed);
}
function updateElapsed() {
  if (!state.playing || state.sessionComplete) return;
  state.elapsed = (performance.now() - state.startTime) / 1000;
}

function updateCharCounts(oldVal, newVal, target) {
  let common = 0;
  const minLen = Math.min(oldVal.length, newVal.length);
  while (common < minLen && oldVal[common] === newVal[common]) common++;

  for (let i = common; i < oldVal.length; i++) {
    if (i < target.length && oldVal[i].toLowerCase() === target[i].toLowerCase()) {
      state.correctChars = Math.max(0, state.correctChars - 1);
    } else {
      state.wrongChars = Math.max(0, state.wrongChars - 1);
    }
  }
  for (let i = common; i < newVal.length; i++) {
    if (i < target.length && newVal[i].toLowerCase() === target[i].toLowerCase()) {
      state.correctChars++;
    } else {
      state.wrongChars++;
    }
  }
}

function syncInput() {
  if (state.sessionComplete || !state.playing) return;

  let newVal = hiddenInput.value;

  if (settings.autoCorrect) {
    const target = state.currentWord;
    const len = Math.min(newVal.length, target.length);
    const corrected = target.substring(0, len);
    if (newVal !== corrected) {
      newVal = corrected;
      setInputValue(corrected);
    }
  }

  const oldVal = state.lastValue;
  if (newVal === oldVal) return;

  const target = state.currentWord;
  updateCharCounts(oldVal, newVal, target);
  state.lastValue = newVal;

  if (newVal.toLowerCase() === target.toLowerCase()) {
    renderWord();
    onWordComplete();
    return;
  }

  if (!settings.autoCorrect && newVal.length > oldVal.length && newVal.length > 0) {
    const lastIdx = newVal.length - 1;
    if (lastIdx < target.length && newVal[lastIdx].toLowerCase() !== target[lastIdx].toLowerCase()) {
      if (state.shakeTimeout) clearTimeout(state.shakeTimeout);
      wordDisplayEl.classList.add('shake');
      state.shakeTimeout = setTimeout(() => wordDisplayEl.classList.remove('shake'), 320);
    }
  }

  renderWord();
  updateStats();
}

function onWordComplete() {
  state.wordsCompleted++;

  stopAutoType();

  if (state.wordsCompleted >= SESSION_LENGTH) {
    state.sessionComplete = true;
    state.playing = false;
    updateElapsed();
    updateStats();
    setTimeout(endGame, 400);
    return;
  }

  wordDisplayEl.classList.add('complete');

  state.currentIndex++;
  if (state.currentIndex + 8 >= state.wordPool.length) {
    state.wordPool = state.wordPool.concat(buildSessionPool(WORDS[state.difficulty]));
  }
  state.currentWord = state.wordPool[state.currentIndex];
  hiddenInput.value = '';
  state.lastValue = '';

  setTimeout(() => {
    wordDisplayEl.classList.remove('complete');
    renderedStart = 0;
    renderedEnd = 0;
    trackOffsetReady = false;
    caret.ready = false;
    lastMode = null;
    renderWord();
    updateStats();
    updateProgress();

    if (settings.autoType && state.playing && !state.sessionComplete) {
      scheduleNextAutoTypeChar();
    }
  }, 200);
}

function endGame() {
  stopAutoType();
  updateElapsed();
  const total = state.correctChars + state.wrongChars;
  const acc = total === 0 ? 100 : Math.round((state.correctChars / total) * 100);
  const minutes = state.elapsed / 60;
  const wpm = minutes > 0.01 ? Math.round((state.correctChars / 5) / minutes) : 0;

  resWpm.textContent = wpm;
  resAcc.textContent = acc + '%';
  resChars.innerHTML = '<span style="color:#5ecf7a">' + state.correctChars + '</span>' +
                       '<span style="color:#646669"> / </span>' +
                       '<span style="color:#ca4754">' + state.wrongChars + '</span>';
  resTime.textContent = formatTime(state.elapsed);

  backBtn.classList.remove('visible');
  caretEl.classList.remove('visible');
  caret.visible = false;

  wordTrackEl.innerHTML = '';
  wordTrackEl.style.transform = '';
  wordDisplayEl.classList.remove('fade');

  resultsOverlay.classList.remove('hidden');
  hiddenInput.blur();
}

hiddenInput.addEventListener('input', syncInput);
hiddenInput.addEventListener('keyup', syncInput);
hiddenInput.addEventListener('change', syncInput);
hiddenInput.addEventListener('compositionend', syncInput);

hiddenInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') e.preventDefault();
  if (e.key === 'Tab') {
    e.preventDefault();
    if (state.playing) restart();
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (state.playing) backToMenu();
  }
});

let lastFrameTs = 0;

function mainLoop(ts) {
  const dt = lastFrameTs ? Math.min((ts - lastFrameTs) / 1000, 0.05) : 0.016;
  lastFrameTs = ts;

  if (state.playing && !state.sessionComplete) {
    if (hiddenInput.value !== state.lastValue) {
      syncInput();
    }
    updateTrackOffset(dt);
    updateCaret(dt);
  } else {
    if (caret.visible) {
      caretEl.classList.remove('visible');
      caret.visible = false;
    }
  }

  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);

function updateTrackOffset(dt) {
  const anchor = wordTrackEl.querySelector('.caret-anchor');
  if (!anchor) return;

  const mode = lastMode || 'centered';
  let targetOffset;

  if (mode === 'treadmill') {
    const caretX = anchor.offsetLeft;
    const fixedX = wordDisplayEl.clientWidth * FIXED_X_RATIO;
    targetOffset = caretX - fixedX;
  } else {
    const trackWidth = wordTrackEl.scrollWidth;
    const viewportWidth = wordDisplayEl.clientWidth;
    targetOffset = (trackWidth - viewportWidth) / 2;
  }

  if (!trackOffsetReady) {
    currentTrackOffset = targetOffset;
    trackOffsetReady = true;
  } else {
    const ease = 1 - Math.exp(-dt * 14);
    currentTrackOffset += (targetOffset - currentTrackOffset) * ease;
  }

  wordTrackEl.style.transform = 'translateX(' + (-currentTrackOffset) + 'px)';
}

function updateCaret(dt) {
  const anchor = wordTrackEl.querySelector('.caret-anchor');
  if (!anchor) {
    if (caret.visible) {
      caretEl.classList.remove('visible');
      caret.visible = false;
    }
    return;
  }

  const rect = anchor.getBoundingClientRect();
  let h = rect.height;
  if (h < 5) {
    const fs = parseFloat(getComputedStyle(wordTrackEl).fontSize);
    h = fs * 1.05;
  }

  const mode = lastMode || 'centered';
  let targetX;
  if (mode === 'treadmill') {
    const vpRect = wordDisplayEl.getBoundingClientRect();
    targetX = vpRect.left + wordDisplayEl.clientWidth * FIXED_X_RATIO;
  } else {
    targetX = rect.left;
  }

  const targetY = rect.top + (rect.height - h) / 2;

  caret.x = targetX;
  if (!caret.ready) {
    caret.y = targetY;
    caret.h = h;
    caret.ready = true;
  } else {
    const ease = 1 - Math.exp(-dt * 14);
    caret.y += (targetY - caret.y) * ease;
    caret.h += (h - caret.h) * ease;
  }

  caretEl.style.transform = 'translate(' + caret.x + 'px, ' + caret.y + 'px)';
  caretEl.style.height = caret.h + 'px';

  if (!caret.visible) {
    caretEl.classList.add('visible');
    caret.visible = true;
  }
}

function tapFocusHandler(e) {
  if (!state.playing || state.sessionComplete) return;
  if (!menuOverlay.classList.contains('hidden')) return;
  if (!resultsOverlay.classList.contains('hidden')) return;
  if (e && e.target && e.target.closest) {
    const btn = e.target.closest('button');
    if (btn) return;
  }
  openKeyboard();
}
document.addEventListener('touchend', tapFocusHandler, { passive: true });
document.addEventListener('click', tapFocusHandler, { passive: true });
document.addEventListener('pointerdown', tapFocusHandler, { passive: true });

function restart() { startGame(state.difficulty); }

function backToMenu() {
  stopAutoType();
  state.playing = false;
  state.sessionComplete = true;
  hiddenInput.value = '';
  state.lastValue = '';
  state.currentWord = '';
  wordTrackEl.innerHTML = '';
  wordTrackEl.style.transform = '';
  wordDisplayEl.classList.remove('fade');
  renderedStart = 0;
  renderedEnd = 0;
  currentTrackOffset = 0;
  trackOffsetReady = false;
  lastMode = null;
  resultsOverlay.classList.add('hidden');
  menuOverlay.classList.remove('hidden');
  backBtn.classList.remove('visible');
  caretEl.classList.remove('visible');
  caret.visible = false;
  closeSettings();
  hiddenInput.blur();
}

document.querySelectorAll('.cfg-row').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    startGame(btn.dataset.diff);
  });
});
resRestart.addEventListener('click', () => startGame(state.difficulty));
resMenu.addEventListener('click', backToMenu);
backBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  backToMenu();
});

setInterval(() => {
  if (!state.playing || state.sessionComplete) return;
  updateElapsed();
  updateStats();
}, 100);

document.addEventListener('keydown', (e) => {
  if (menuOverlay.classList.contains('hidden')) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    startGame(state.difficulty);
  }
});

window.addEventListener('resize', () => {
  if (state.playing && !state.sessionComplete) {
    trackOffsetReady = false;
    caret.ready = false;
    lastMode = null;
    renderWord();
  }
});

document.addEventListener('touchmove', (e) => {
  if (!state.playing || state.sessionComplete) return;
  if (!menuOverlay.classList.contains('hidden')) return;
  if (!resultsOverlay.classList.contains('hidden')) return;
  if (e.target && e.target.closest && e.target.closest('#menuOverlay, #resultsOverlay')) return;
  e.preventDefault();
}, { passive: false });

})();
</script>
</body>
</html>
