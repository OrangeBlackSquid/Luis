<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für Mobile: Verhindert das automatische Zoomen und sorgt für die richtige Skalierung -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physik Sandbox Mobile</title>
    <style>
        /* --- CSS (Design & Layout) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Entfernt blaues Aufblitzen beim Tippen auf dem Handy */
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Verhindert Scrollen der Seite */
            background-color: #1a2233;
            touch-action: none; /* Verhindert Zoom und Scroll-Gesten */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111827;
        }

        /* Gitter-Hintergrund für den Sandbox-Look */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #111827;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* UI Panel - Am unteren Rand für Mobile optimiert */
        #ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 34, 51, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            max-height: 45vh; /* Falls es zu viel wird, kann man es scrollen */
            overflow-y: auto;
        }

        /* Auf größeren Bildschirmen (Desktop) sieht es wieder wie ein schwebendes Panel aus */
        @media (min-width: 768px) {
            #ui-panel {
                top: 20px;
                left: 20px;
                bottom: auto;
                width: 280px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }
        }

        h2 {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .tool-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        button {
            flex: 1 1 calc(33.333% - 6px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        button.active {
            background: #5ecf7a;
            color: #111827;
            border-color: #5ecf7a;
        }

        button#btn-bomb.active { background: #ef4444; border-color: #ef4444; color: white; }
        button#btn-heavy.active { background: #9ca3af; border-color: #9ca3af; color: #111827; }
        button#btn-ball.active { background: #fcc02a; border-color: #fcc02a; color: #111827; }
        button#btn-eraser.active { background: #ff7f50; border-color: #ff7f50; color: white; }

        .sliders {
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 10px;
            color: #9ca3af;
            flex: 1;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #5ecf7a;
            cursor: pointer;
            height: 20px;
        }

        #clear-btn {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
            margin-top: 4px;
        }

        #clear-btn:hover, #clear-btn:active {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="sandboxCanvas"></canvas>

        <div id="ui-panel">
            <div>
                <h2>Werkzeuge</h2>
                <div class="tool-grid">
                    <button id="btn-block" class="active">Block</button>
                    <button id="btn-ball">Ball</button>
                    <button id="btn-heavy">Schwer</button>
                    <button id="btn-bomb">Bombe</button>
                    <button id="btn-eraser" style="flex: 1 1 100%;">Radiergummi</button>
                </div>
            </div>

            <div>
                <h2>Physik</h2>
                <div class="sliders">
                    <div class="slider-container">
                        <label>Schwerkraft: <span id="gravity-val">0.5</span></label>
                        <input type="range" id="gravity-slider" min="0" max="2" step="0.1" value="0.5">
                    </div>
                    <div class="slider-container">
                        <label>Elastizität: <span id="bounce-val">0.3</span></label>
                        <input type="range" id="bounce-slider" min="0" max="1" step="0.1" value="0.3">
                    </div>
                </div>
            </div>

            <button id="clear-btn">Alles löschen</button>
        </div>
    </div>

    <script>
        /* --- JavaScript (Physik-Engine & Sandbox Logik) --- */
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas Größe an Container anpassen (Wichtig für Mobile)
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        // Initiale Größe setzen
        setTimeout(resizeCanvas, 0);

        // Globale Variablen
        let entities = [];
        let particles = [];
        let gravity = 0.5;
        let globalBounce = 0.3;
        let currentTool = 'block';
        
        // Variablen für die Wisch-Steuerung
        let isDrawing = false;
        let lastSpawnX = 0;
        let lastSpawnY = 0;
        const SPAWN_DISTANCE = 35; // Mindestabstand zwischen Objekten beim Wischen

        // UI Elemente
        const buttons = {
            block: document.getElementById('btn-block'),
            ball: document.getElementById('btn-ball'),
            heavy: document.getElementById('btn-heavy'),
            bomb: document.getElementById('btn-bomb'),
            eraser: document.getElementById('btn-eraser')
        };
        const gravitySlider = document.getElementById('gravity-slider');
        const bounceSlider = document.getElementById('bounce-slider');
        const clearBtn = document.getElementById('clear-btn');

        // UI Event Listeners
        Object.keys(buttons).forEach(key => {
            buttons[key].addEventListener('click', () => {
                Object.values(buttons).forEach(b => b.classList.remove('active'));
                buttons[key].classList.add('active');
                currentTool = key;
            });
        });

        gravitySlider.addEventListener('input', (e) => {
            gravity = parseFloat(e.target.value);
            document.getElementById('gravity-val').innerText = gravity.toFixed(1);
        });

        bounceSlider.addEventListener('input', (e) => {
            globalBounce = parseFloat(e.target.value);
            document.getElementById('bounce-val').innerText = globalBounce.toFixed(1);
        });

        clearBtn.addEventListener('click', () => {
            entities = [];
            particles = [];
        });

        // --- KOORDINATEN BERECHNUNG (Wichtig für Mobile Skalierung) ---
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            // Skalierung berechnen (falls das Canvas durch CSS verkleinert/vergrößert wird)
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        // --- POINTER EVENTS (Maus & Touch vereint) ---
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Verhindert Standard-Touch-Verhalten
            isDrawing = true;
            const pos = getPointerPos(e);
            
            if (currentTool === 'eraser') {
                eraseAt(pos.x, pos.y);
            } else {
                spawnEntity(pos.x, pos.y);
                lastSpawnX = pos.x;
                lastSpawnY = pos.y;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            
            const pos = getPointerPos(e);
            
            if (currentTool === 'eraser') {
                eraseAt(pos.x, pos.y);
            } else {
                // Berechne die Distanz zum zuletzt platzierten Objekt
                const dx = pos.x - lastSpawnX;
                const dy = pos.y - lastSpawnY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // Wenn weit genug gewischt wurde, platziere ein neues Objekt
                if (dist > SPAWN_DISTANCE) {
                    spawnEntity(pos.x, pos.y);
                    lastSpawnX = pos.x;
                    lastSpawnY = pos.y;
                }
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            e.preventDefault();
            isDrawing = false;
        });
        
        // Falls der Finger den Bildschirm verlässt oder die Berührung abgebrochen wird
        canvas.addEventListener('pointercancel', (e) => {
            e.preventDefault();
            isDrawing = false;
        });
        
        canvas.addEventListener('pointerleave', () => {
            isDrawing = false;
        });

        // --- ENTITY KLASSE ---
        class Entity {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.type = type;
                this.isDead = false;

                // Standardwerte
                this.w = 50;
                this.h = 50;
                this.mass = 1;
                this.color = '#5ecf7a';
                this.restitution = globalBounce;

                // Typ-spezifische Anpassungen
                if (type === 'ball') {
                    this.w = 35; this.h = 35;
                    this.color = '#fcc02a';
                    this.restitution = Math.max(globalBounce, 0.7);
                    this.mass = 0.8;
                } else if (type === 'heavy') {
                    this.w = 60; this.h = 60;
                    this.color = '#9ca3af';
                    this.restitution = Math.min(globalBounce, 0.2);
                    this.mass = 5;
                } else if (type === 'bomb') {
                    this.w = 30; this.h = 30;
                    this.color = '#ef4444';
                    this.restitution = 0.1;
                    this.mass = 1.5;
                }
            }

            update() {
                if (this.isDead) return;
                
                this.vy += gravity;
                this.x += this.vx;
                this.y += this.vy;

                // Luftwiderstand
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Kollision mit Wänden
                if (this.x < 0) { this.x = 0; this.vx *= -this.restitution; }
                if (this.x + this.w > canvas.width) { this.x = canvas.width - this.w; this.vx *= -this.restitution; }
                if (this.y < 0) { this.y = 0; this.vy *= -this.restitution; }
                if (this.y + this.h > canvas.height) { 
                    this.y = canvas.height - this.h; 
                    this.vy *= -this.restitution;
                    this.vx *= 0.9; // Bodenreibung
                }
            }

            draw() {
                if (this.isDead) return;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'ball') {
                    ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x + this.w/3, this.y + this.h/3, this.w/6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.roundRect(this.x, this.y, this.w, this.h, 8);
                    ctx.fill();
                    
                    if (this.type === 'bomb') {
                        ctx.fillStyle = '#fcc02a';
                        ctx.fillRect(this.x + this.w/2 - 2, this.y - 10, 4, 10);
                        ctx.beginPath();
                        ctx.arc(this.x + this.w/2, this.y - 10, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            explode() {
                if (this.type !== 'bomb' || this.isDead) return;
                this.isDead = true;
                
                const bx = this.x + this.w/2;
                const by = this.y + this.h/2;
                const radius = 150;
                const force = 15;

                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(bx, by));
                }

                entities.forEach(e => {
                    if (e === this || e.isDead) return;
                    const ex = e.x + e.w/2;
                    const ey = e.y + e.h/2;
                    const dx = ex - bx;
                    const dy = ey - by;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < radius && dist > 0) {
                        const power = force * (1 - dist/radius);
                        e.vx += (dx / dist) * power;
                        e.vy += (dy / dist) * power;
                    }
                });
            }
        }

        // --- PARTIKEL KLASSE ---
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.life = 1.0;
                this.color = Math.random() > 0.5 ? '#ef4444' : '#fcc02a';
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life -= 0.02;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- SPIEL LOGIK ---
        function spawnEntity(x, y) {
            // Verhindern, dass Objekte zu nah am Rand spawnen
            x = Math.max(10, Math.min(x, canvas.width - 60));
            y = Math.max(10, Math.min(y, canvas.height - 60));
            
            // Um Performance auf dem Handy zu sparen, begrenzen wir die Anzahl der Objekte
            if (entities.length > 250) {
                entities.shift(); // Entfernt das älteste Objekt
            }
            
            const newEntity = new Entity(x - 25, y - 25, currentTool);
            entities.push(newEntity);
        }

        function eraseAt(x, y) {
            // Von hinten nach vorne durchgehen, um das oberste Objekt zu löschen
            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                if (x >= e.x && x <= e.x + e.w && y >= e.y && y <= e.y + e.h) {
                    entities.splice(i, 1);
                    return; 
                }
            }
        }

        // Kollisionsauflösung
        function resolveCollisions() {
            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    let a = entities[i];
                    let b = entities[j];
                    if (a.isDead || b.isDead) continue;

                    if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
                        let overlapX = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
                        let overlapY = Math.min(a.y + a.h - b.y, b.y + b.h - a.y);

                        if (a.type === 'bomb' && Math.abs(a.vy) > 2) a.explode();
                        if (b.type === 'bomb' && Math.abs(b.vy) > 2) b.explode();

                        if (overlapX < overlapY) {
                            if (a.x < b.x) { a.x -= overlapX / 2; b.x += overlapX / 2; }
                            else { a.x += overlapX / 2; b.x -= overlapX / 2; }
                            
                            let temp = a.vx; 
                            a.vx = b.vx * b.restitution; 
                            b.vx = temp * a.restitution;
                        } else {
                            if (a.y < b.y) { a.y -= overlapY / 2; b.y += overlapY / 2; }
                            else { a.y += overlapY / 2; b.y -= overlapY / 2; }
                            
                            let temp = a.vy; 
                            a.vy = b.vy * b.restitution; 
                            b.vy = temp * a.restitution;
                            
                            a.vx *= 0.95; b.vx *= 0.95;
                        }
                    }
                }
            }
        }

        // --- HAUPT LOOP ---
        function gameLoop() {
            entities.forEach(e => {
                e.update();
                if (e.type === 'bomb' && e.y + e.h >= canvas.height && Math.abs(e.vy) > 2) {
                    e.explode();
                }
            });
            
            resolveCollisions();

            particles.forEach(p => p.update());
            
            entities = entities.filter(e => !e.isDead);
            particles = particles.filter(p => p.life > 0);

            // Zeichnen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            entities.forEach(e => e.draw());
            particles.forEach(p => p.draw());

            requestAnimationFrame(gameLoop);
        }

        // Spiel starten
        gameLoop();
    </script>
</body>
</html>
